# ARCHIVED — NOT A CATALOG PLAN. Do not copy this as a pattern.
# Predates the current controller and catalog gate; see archive/README.md.
# Existed on: gcp, az
# Phase: gcp=Succeeded, az=Paused
# AgentRuns owned: gcp=5, az=0
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: port-plan-firability-preflight
  namespace: jx-staging
spec:
  steps:
  - agentType: leartech-agent-go
    inputs:
      branch: feat/firability-preflight
      goal: "Port the DYNAMIC firability preflight from the soon-to-be-archived leartech-orchestrator\
        \ into plan-api, so the capability survives its decommission.\nREAD THE SOURCE FIRST \u2014 DO\
        \ NOT WORK FROM THIS DESCRIPTION. The reference implementation is gate/orch/plan_verify.py (verify_plan_firability)\
        \ in mikelear/leartech-orchestrator, with gate/orch/plan_summarise.py as a secondary caller showing\
        \ how the result is consumed. Read them in full before designing. Prose about a well-commented\
        \ implementation is lossy; the code carries its own rationale. Port the SEMANTICS \u2014 the checks\
        \ and their edge cases \u2014 not the Python structure.\nTHE FOUR CHECKS to preserve: (1) catalog\
        \ membership per step; (2) repo existence plus default branch; (3) branch availability, including\
        \ whether the branch collides with an already-open PR; (4) same-repo parallelism, i.e. steps that\
        \ would concurrently write one repo. The Python returns a structured result with a per-check breakdown\
        \ AND a top-level ok plus blocking_issues list \u2014 keep that shape, because callers distinguish\
        \ \"advisory detail\" from \"this will not fire\".\nUSE #32's MCP TOOLS, DO NOT HAND-ROLL A GITHUB\
        \ CLIENT. repo_exists / branch_exists on the repo-factory MCP are the intended primitives. Preserve\
        \ their central distinction: 404 means a clean \"does not exist\"; any other error means \"could\
        \ not check\" and MUST NOT be reported as \"does not exist\". A preflight that conflates the two\
        \ either blocks good Plans during a GitHub incident or waves through Plans targeting repos that\
        \ are not there. If those tools are not yet available on the cluster you build against, STOP and\
        \ say so in the PR description rather than adding a direct GitHub dependency to plan-api.\nSURFACE\
        \ IT AS A READ-ONLY ENDPOINT, SEPARATE FROM CREATE. Add a preflight endpoint that takes a Plan\
        \ body and returns the report WITHOUT creating anything. Do NOT make create depend on it in this\
        \ PR: the checks reach out to GitHub, so wiring them into the create path turns Plan creation\
        \ into something that fails when GitHub is slow or down. Whether create should ever consult it\
        \ \u2014 and whether a failure there should block or warn \u2014 is a follow-up decision, and\
        \ worth stating as an open question in the PR description rather than settling here.\nFOLLOW THIS\
        \ REPO'S EXISTING SHAPE. plan-api already has internal/plans, internal/handlers, internal/dto\
        \ and delegates static validation to the shared planlint package. Put the preflight alongside\
        \ that, keep the DTO conventions, and register the route the way the existing ones are registered.\
        \ This is additive: no existing endpoint's behaviour may change.\nISOLATE TESTING: table-driven\
        \ Go unit tests with the MCP client faked \u2014 assert each of the four checks independently;\
        \ assert repo-absent (404) and could-not-check (non-404) produce DIFFERENT outcomes; assert a\
        \ branch colliding with an open PR is reported; assert two steps on one repo are flagged; and\
        \ assert a fully-clean Plan returns ok with an empty blocking_issues. Non-negative coverage delta.\
        \ No cluster and no live GitHub required.\nLOGGING TO VERIFY: one structured line per preflight\
        \ with the plan name and the per-check outcome, so \"why was this Plan judged unfirable\" is answerable\
        \ from Loki without re-running it.\nDone = PR merged (open via open_pr, drive gates green)."
      name: firability-preflight-api
      repo: mikelear/leartech-plan-api
    kind: pr
    name: firability-preflight-api
  - dependsOn:
    - firability-preflight-api
    kind: check
    name: firability-preflight-api-verify-release
    use: verify-release-flow
    with:
      pr: ${steps.firability-preflight-api.pr}
      repo: mikelear/leartech-plan-api
      service: leartech-plan-api
  triggeredBy: plan-catalog-internal-services
