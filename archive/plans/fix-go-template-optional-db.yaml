spec:
  steps:
  - agentType: leartech-agent-go
    inputs:
      branch: fix/optional-db-dependency
      goal: "Make a freshly-scaffolded service from leartech-go-service-template deploy\nHEALTHY with\
        \ NO secret provisioned \u2014 mirror leartech-angular-service-template,\nwhose chart has ZERO\
        \ secretKeyRefs so `scaffold-pr` \u2192 deploy just works. Today\nthe Go template's chart hardcodes\
        \ a MANDATORY database dependency:\n  env DATABASE_URL <- secretKeyRef {name: <svc>-db, key: DATABASE_URL},\n\
        \  optional: false\nplus a DB migrations Job/init that needs the same secret. A brand-new service\n\
