# Phase: gcp=Cancelled, az=Paused
# AgentRuns owned: gcp=2, az=0
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: plan-submit-reads-resubmit-verdict
  namespace: jx-staging
spec:
  command:
    reason: 'Work complete and merged as plan-catalog#68 with all 7 gates green: plan-submit now fails
      on a differs/conflict_running verdict instead of printing SKIP, and the release guard that exit
      0''d when LEARTECH_PLAN_SUBMIT_CLIENT_SECRET was unset is removed (secret verified present on both
      clusters). Cancelled on the injected promote-merged and deploy-healthy checks only: leartech-plan-catalog
      has no charts/ and no Dockerfile, its release runs sync-templates and submit-plans, so it builds
      no image and deploys nothing. No promote PR exists in either GitOps repo and none can. The injection
      rule treats requiresRepo as a proxy for deployable and that proxy does not hold for a catalog repo.
      Not marked Succeeded, because the checks did not pass. Agreed with Mike: non-deployable repos are
      out of scope for verify-release-flow - real Plan authors target deployable services, and this only
      arises because we are building the ecosystem itself. Do not fix the injection rule for this case.'
    uid: cancel-1788438900
    verb: cancel
  steps:
  - agentType: leartech-agent-go
    inputs:
      branch: fix/plan-submit-resubmit-verdict
      goal: "Make plan-submit fail when plan-api tells it an amendment was not applied.\nCONFIRM THE PREMISE\
        \ FIRST. Read cmd/plan-submit/main.go around the http.StatusConflict case and confirm it prints\
        \ SKIP and does not read the response body. Then read leartech-plan-api's internal/plans/handler.go\
        \ and respondResubmitConflict on origin/main to get the exact wire contract \u2014 the field name\
        \ and the exact verdict values. Do NOT guess the shape from this brief: read the producer and\
        \ quote what you found in the PR description. If plan-submit already reads the verdict, STOP and\
        \ report that.\nTHE THREE VERDICTS, AND WHAT EACH MUST DO. identical is a genuine success \u2014\
        \ the on-cluster Plan already matches the file, and printing SKIP is correct. differs means the\
        \ file changed and plan-api DID NOT apply it, so the submit has failed and must exit non-zero.\
        \ conflict_running means the Plan is mid-flight and must also fail. Make each an explicit case;\
        \ do not group differs with identical.\nAN ABSENT OR UNRECOGNISED VERDICT MUST FAIL, NOT DEFAULT\
        \ TO SUCCESS. If the body carries no verdict, or one this code does not recognise, exit non-zero\
        \ saying so rather than falling back to the old treat-409-as-success behaviour. A reader that\
        \ cannot determine an outcome must say so \u2014 the same rule that made run_report render UNAVAILABLE\
        \ instead of 0. State in the PR description that this means a plan-api older than #33 would now\
        \ fail the step, and that both clusters already run a version containing it.\nDO NOT MAKE plan-submit\
        \ REPLACE THE PLAN. plan-api deliberately never mutates the on-cluster Plan, and a running Plan's\
        \ history must not be destroyed to force an amendment through. Do not add delete-then-recreate,\
        \ force or upgrade behaviour. The correct outcome is a clear failure.\nTHE ERROR MESSAGE IS THE\
        \ DELIVERABLE. Whoever sees this failure sees it as a red commit status on main with the PipelineRun\
        \ already reaped, so the message is likely the only artefact they get. It must name the plan,\
        \ say the amendment was not applied, and state the remediation: delete the Plan CR and re-submit.\
        \ Where plan-api's body describes what differs, include that rather than a bare verdict.\nFAIL\
        \ THE WHOLE STEP, NOT JUST THE ONE PLAN. plan-submit already counts failures and exits non-zero\
        \ when any occurred; a differs verdict must feed that same counter so one stale plan fails the\
        \ release step. Confirm by reading the exit path that this is what happens.\nSECOND ITEM, SAME\
        \ FAIL-OPEN CLASS: remove the dormant-route guard in .lighthouse/jenkins-x/release.yaml that exits\
        \ 0 when LEARTECH_PLAN_SUBMIT_CLIENT_SECRET is unset. The secret is provisioned on both clusters.\
        \ A missing secret must fail the step, because silently submitting no Plans at all is the worst\
        \ possible outcome of this pipeline and is currently green. Confirm the secret exists before removing\
        \ the guard, and say so in the PR.\nDO NOT DOCUMENT THE NEW BEHAVIOUR IN A COMMENT. The defect\
        \ being fixed is a comment asserting an invariant nothing enforced. Put the behaviour in tests,\
        \ named so the intent is readable from the test name.\nISOLATE TESTING: table-driven Go tests,\
        \ offline, no cluster, against a fake HTTP server in the style of the existing suite. Cover: identical\
        \ exits 0 and prints SKIP; differs exits non-zero and the message names the plan and the remediation;\
        \ conflict_running exits non-zero; a 409 with no verdict exits non-zero; a 409 with an unrecognised\
        \ verdict exits non-zero; one differs among several plans fails the whole run; and 201 still succeeds.\
        \ Prove each is load-bearing by breaking it. Non-negative coverage delta.\nDone = PR merged (open\
        \ via open_pr, drive gates green)."
      name: submit-reads-verdict
      repo: mikelear/leartech-plan-catalog
    kind: pr
    name: submit-reads-verdict
  - dependsOn:
    - submit-reads-verdict
    kind: check
    name: submit-reads-verdict-verify-release
    use: verify-release-flow
    with:
      pr: ${steps.submit-reads-verdict.pr}
      repo: mikelear/leartech-plan-catalog
      service: leartech-plan-catalog
  triggeredBy: plan-catalog-internal-services
