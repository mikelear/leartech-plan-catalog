apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: prompt-contract-checks-tool-schemas
  namespace: jx-staging
spec:
  steps:
  - agentType: leartech-agent-py
    inputs:
      branch: feat/prompt-contract-tool-schemas
      goal: "Make the prompt's documented tool signatures verifiable against the schemas the MCP servers\
        \ actually publish, so a prompt that misstates an argument name or type fails a test instead of\
        \ costing turns at run time.\nCONFIRM THE PREMISE FIRST. Read tests/test_prompt_contract.py and\
        \ scripts/render_system_prompt.py and confirm: the contract test runs offline, it already checks\
        \ tool names against a catalogue, and nothing compares the prompt to a published schema. Read\
        \ docs/agent-system-prompt.md and list every place it states a tool signature or argument. If\
        \ signatures are already schema-checked, STOP and report that.\nSNAPSHOT THE SCHEMAS, DO NOT FETCH\
        \ THEM IN THE TEST. Add a script that discovers the live tool schemas and writes a committed artefact,\
        \ and have the contract test assert against that artefact. Mirror scripts/render_system_prompt.py\
        \ exactly: --write regenerates, a bare run FAILS when the artefact is stale. Do NOT make the test\
        \ conditional on credentials or network \u2014 a test that skips itself when unconfigured reports\
        \ success while checking nothing, which is the failure mode this whole effort exists to remove.\n\
        WHAT THE TEST MUST CATCH. At minimum, for every tool the prompt names: the tool exists in the\
        \ snapshot; every argument the prompt names exists on that tool; and where the prompt states or\
        \ implies an argument's type, it matches the schema. The motivating case is `pr_number`, which\
        \ the prompt names correctly and whose type it never mentions while the schema requires an integer\
        \ \u2014 the agent has passed a string three times across two runs, on two different tools.\n\
        PREFER DELETING A DUPLICATED CONTRACT TO TESTING IT. Where the prompt restates a signature that\
        \ the schema already gives the model at call time, consider whether the prompt needs to say it\
        \ at all. Argue the choice in the PR description rather than assuming: the `pr_number` name clause\
        \ exists because the agent once passed `pr`, so removing guidance has a real cost. Removing a\
        \ duplicate is better than testing it; keeping an untested duplicate is the worst of the three.\n\
        NOT IN SCOPE. Do not change the prompt's content beyond what the new test forces, do not change\
        \ which tools are advertised or allowed, and do not add a runtime check inside the agent \u2014\
        \ this is a build-time contract, not a guard rail.\nISOLATE TESTING: pytest, offline, in the style\
        \ of the existing suite. Cover: a prompt naming a tool absent from the snapshot fails; a prompt\
        \ naming an argument absent from a tool fails; a prompt stating the wrong type fails; a stale\
        \ snapshot fails; and the current prompt passes. Prove each is load-bearing by breaking it. Non-negative\
        \ coverage delta.\nDone = PR merged (open via open_pr, drive gates green)."
      name: prompt-contract-tool-schemas
      repo: mikelear/leartech-automated-agent
    kind: pr
    name: prompt-contract-tool-schemas
  - dependsOn:
    - prompt-contract-tool-schemas
    kind: check
    name: prompt-contract-tool-schemas-verify-release
    use: verify-release-flow
    with:
      pr: ${steps.prompt-contract-tool-schemas.pr}
      repo: mikelear/leartech-automated-agent
      service: leartech-automated-agent
  triggeredBy: plan-catalog-internal-services
