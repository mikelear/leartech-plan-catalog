        EVIDENCE ALREADY GATHERED (do not re-derive, build on it):

        - PR #2 (feat: announce pr.merged / pr.closed_unmerged to Maestro) merged to main as commit e90376e5513f89f280680a2bccf3be3d3c5f6ef9
