apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fix-agent-dashboards
  namespace: jx-staging
spec:
  steps:
  - agentType: leartech-agent-py
    inputs:
      branch: fix/dashboard-query-vocabulary
      goal: "The 3-tier Grafana dashboards in charts/leartech-automated-agent/dashboards/\n(plans.json,\
        \ plan-and-loop.json, agent-runs.json) show \"no data\" panels and\nhave slow / hanging template-variable\
        \ dropdowns. These root causes were\nverified LIVE against Loki (jx-staging, loki.jx-observability.svc:3100)\
        \ \u2014 do\nNOT re-investigate from scratch, implement the fixes:\n\nFIX 1 \u2014 TIER-1 \"Plans\"\
        \ (plans.json) queries the WRONG field + source.\nThe panels use `{namespace=\"$ns\"} | json |\
        \ event=\"plan.completed\"` (and\nevent=\"plan.step_started\" / \"plan.step_done\") against the\
        \ CONTROLLER stream.\nThe controller does NOT emit those as log lines \u2014 announcePlanEvents\
        \ sends\nplan.* to Maestro as EVENTS; the only local log is a V(1) debug \"plan\nreconciled\"\
        . The lifecycle IS visible in the MAESTRO stream as\n`eventName=\"plan.completed\"` / \"plan.step_started\"\
        \ / \"plan.step_done\"\n(confirmed counts 32 / 52 / 52 over 6.5h). Repoint every TIER-1 panel\
        \ to the\nmaestro stream + the `eventName=` field, e.g.\n  {namespace=\"$ns\", app=\"leartech-maestro-service\"\
        } | json\n    | eventName=\"plan.completed\"\nMaestro carries `plan`, `phase`, `step` fields \u2014\
        \ keep the per-step timeline,\nthe succeeded/failed/resolved stats, and the recent-lifecycle log\
        \ panel, all\ndriven off eventName + plan/phase/step. Scope the stream by the maestro app\nlabel\
        \ (find the real label with `kubectl -n jx-staging get pods\n--show-labels | grep maestro`) so\
        \ it isn't a whole-namespace scan.\n\nFIX 2 \u2014 template-variable dropdowns hang. $event_id,\
        \ $plan, $run_id use\n`label_values({namespace=\"$ns\"} |~ \"\u2026\" | json | field=~\".+\",\
        \ field)` \u2014 an\nunbounded `| json` scan over the whole namespace + dashboard range. Cheapen\n\
        them: (a) constrain each to the specific app/stream that emits the field\n(maestro for event_id/plan\
        \ on loop_hop lines; the agent pods for run_id), and\n(b) bound the lookup range (e.g. add a small\
        \ time range, or use a label where\none exists). $run = `label_values({namespace=\"$ns\"}, pod)`\
        \ enumerates every\npod ever \u2014 restrict it to agent-run pods (pod=~\"\u2026-[0-9]+\" or the\
        \ run label).\nSet sensible `current`/`allValue=\".+\"` so a first open isn't a giant scan.\n\n\
        FIX 3 \u2014 TIER-2 loop (plan-and-loop.json) vocab is CORRECT (loop_hop/event_id\n\u2014 leave\
        \ it). Just ensure panels degrade gracefully when a hop is absent\n(stat panels show 0 not \"\
        No data\"; the trace log panel keeps a `| json`\nfallback). Add a short panel description noting\
        \ hops populate as loops fire.\n\nFIX 4 (TIER-3 agent-runs.json) \u2014 keep as-is (run_end=54,\
        \ works); only apply\nthe same $run/$run_id dropdown cheapening from FIX 2.\n\nNEW TEST \u2014\
        \ add ONE small, purpose-built dashboard\u2194Loki contract test. Keep it\nCLEAN and specific\
        \ \u2014 a single Python file (pytest), NOT a wall of shell/grep:\n  tests/dashboards/test_dashboard_queries.py\n\
        It must:\n  - Discover every *.json in charts/leartech-automated-agent/dashboards/ and\n    parse\
        \ each panel target `expr` (and template-var query).\n  - Substitute Grafana macros with test\
        \ defaults: $ns\u2192env LOKI_NS (default\n    \"jx-staging\"); $plan/$event_id/$run/$run_id\u2192\
        \".+\"; $__range/$__interval\u2192a\n    fixed window (e.g. [1h]); strip aggregation wrappers\
        \ as needed to run.\n  - Run each query against Loki (LOKI_URL env, default\n    http://loki.jx-observability.svc:3100)\
        \ with a per-query timeout\n    (e.g. 10s) \u2014 a query that errors or exceeds the timeout FAILS\
        \ the test.\n  - Assert NO `__error__` label appears in any result stream (this is what\n    catches\
        \ `| json`/field/parse mistakes \u2014 the exact class of bug being\n    fixed).\n  - SENTINEL\
        \ check: a tiny curated list of queries that MUST return >0 rows\n    in a healthy staging \u2014\
        \ assert data present for:\n      maestro `eventName=\"plan.completed\"`, loop_hop=\"maestro_receive\"\
        ,\n      and run_end (event=\"run_end\"). Empty sentinel => FAIL.\n  - For all OTHER panels: zero\
        \ rows is a WARN (print it), NOT a failure \u2014\n    low traffic must never break the gate.\n\
        \  - Print a clean summary table (dashboard, panel, rows, latency_ms, status).\nIMPORTANT gate-safety:\
        \ this test is potentially environment-sensitive, so it\nmust be wired into end2end as REPORT-ONLY\
        \ / NON-BLOCKING for now (e.g. a\nseparate marked step that always exits 0 but prints the table,\
        \ or pytest\nmarker `@pytest.mark.dashboards` excluded from the blocking end2end selector).\n\
        We will run it MANUALLY a few times first (document the exact manual command +\nrequired env in\
        \ tests/dashboards/README.md) and flip it to blocking in a\nfollow-up once proven. Do NOT make\
        \ it a blocking gate in this PR.\n\nValidate every dashboard JSON still parses (json.load) and\
        \ that\ngrafana-dashboards.yaml mounts all three. Keep chart render + existing smoke\ngreen. Own\
        \ the PR + drive BOTH clusters' gates green THROUGH TO MERGE.\n"
      name: fix-agent-dashboards
      repo: leartech-automated-agent
    name: fix-dashboards
    repo: mikelear/leartech-automated-agent
  - agentType: leartech-agent-infra
    dependsOn:
    - fix-dashboards
    inputs:
      action: release-health-check
      budgetMinutes: 60
      healthPath: /health
      namespace: jx-staging
      service: leartech-automated-agent
    name: release-check
  tenant: leartech
  triggeredBy: human
