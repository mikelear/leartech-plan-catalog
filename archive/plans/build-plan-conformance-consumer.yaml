# ARCHIVED — NOT A CATALOG PLAN. Do not copy this as a pattern.
# Predates the current controller and catalog gate; see archive/README.md.
# Existed on: gcp
# Phase: gcp=Succeeded
# AgentRuns owned: gcp=9
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: build-plan-conformance-consumer
  namespace: jx-staging
spec:
  steps:
  - agentType: leartech-agent-infra
    inputs:
      action: create-repo
      newRepo: mikelear/leartech-plan-conformance-consumer
    kind: apply
    name: create
  - agentType: leartech-agent-infra
    dependsOn:
    - create
    inputs:
      action: register-source-config
      cluster: gcp
      namespace: jx-plan-conformance
      service: leartech-plan-conformance-consumer
    kind: pr
    name: register-gcp
    repo: mikelear/jx-build-cluster-gsm
  - agentType: leartech-agent-infra
    dependsOn:
    - create
    inputs:
      action: register-source-config
      cluster: az
      namespace: jx-plan-conformance
      service: leartech-plan-conformance-consumer
    kind: pr
    name: register-az
    repo: mikelear/jx-build-cluster-akv
  - agentType: leartech-agent-infra
    dependsOn:
    - register-gcp
    - register-az
    inputs:
      action: scaffold-pr
      name: leartech-plan-conformance-consumer
      template: go
    kind: pr
    name: scaffold
  - agentType: leartech-agent-infra
    dependsOn:
    - scaffold
    inputs:
      action: smoke-pr
      name: leartech-plan-conformance-consumer
    kind: apply
    name: smoke
  - agentType: leartech-agent-go
    dependsOn:
    - smoke
    inputs:
      branch: smoke-leartech-plan-conformance-consumer
      goal: "Adopt the open smoke PR for the freshly-scaffolded leartech-plan-conformance-consumer\nGo\
        \ service (idempotent open_pr), own it, and drive BOTH clusters' gates green THROUGH\nTO MERGE\
        \ so the first release cuts. No features here \u2014 just make the scaffold green + merged.\n"
      name: consumer-smoke-dev
      repo: leartech-plan-conformance-consumer
    kind: pr
    name: smoke-dev
    repo: mikelear/leartech-plan-conformance-consumer
  - agentType: leartech-agent-infra
    dependsOn:
    - smoke-dev
    inputs:
      action: release-health-check
      budgetMinutes: 60
      healthPath: /health
      namespace: jx-plan-conformance
      service: leartech-plan-conformance-consumer
    kind: check
    name: release-monitor
  - agentType: leartech-agent-go
    dependsOn:
    - release-monitor
    inputs:
      branch: feat/maestro-consume
      goal: "Turn the scaffolded service into a REAL Maestro event CONSUMER \u2014 using the STANDARD\n\
        platform consume pattern (this service is the reference proof of \"how a service\nconsumes\" +\
        \ the chart wiring, so do NOT invent a bespoke mechanism; mirror how\nleartech-orchestrator-controller's\
        \ BA event consumer + its maestro EventRegistration\nwork, and reuse leartech-bus-common if it\
        \ provides a consumer helper).\n\nCONVENTIONS REFERENCE \u2014 mirror **leartech-plan-api**, NOT\
        \ the go template. plan-api is\nthe current CLEANEST service on the estate (the go-service-template\
        \ has drifted behind\nand will be brought up to speed separately). Bring the scaffold up to plan-api's\
        \ setup:\nits .lighthouse quality suite (ai-review, end2end, govulncheck, lint, security-scan,\n\
        test, per-cluster release with cluster-suffix tags), its chart layout, kyverno-compliant\nsecurityContext,\
        \ structured logging, health endpoints, and Makefile conventions. Where\nthe scaffold (from the\
        \ template) differs from plan-api, prefer the plan-api way.\n\nENDPOINTS (add to the scaffold;\
        \ keep its /health + /healthz):\n  POST /consume_event  \u2192 accept the Maestro ConsumeEventRequest\
        \ JSON\n                         {id,name,annotations,producedTime,actionedBy}; record it;\n \
        \                        log ONE structured JSON line (event=consumed, name, id,\n           \
        \              plan=annotations.plan) so it's greppable in Loki; return 200\n                \
        \         {\"isConsumed\":true,\"isErrored\":false} (bad body \u2192 400 + isErrored:true).\n\
        \  GET  /confirmed?name=<event> \u2192 {\"consumed\":true,\"count\":N} or {\"consumed\":false}\n\
        \                         (lets a test runner assert an event fired + was consumed).\n  GET  /events\
        \         \u2192 debug dump of recorded events.\n\nCHART (the standard consume wiring \u2014 this\
        \ is the part we've had trouble with, so get it\nright + prove it): render a Maestro EventRegistration\
        \ for this service that CONSUMES the\nTEST-SCOPED event(s) `test.release.deploy_failed` \u2192\
        \ endpoint `/consume_event`, pointed at\nthe ISOLATED Maestro. Deploy target is namespace jx-plan-conformance\
        \ (NOT jx-staging) and\nthe isolated Maestro at http://leartech-maestro-service.jx-plan-conformance.svc.cluster.local:5000\n\
        \u2014 set these via chart values so the per-cluster release deploys the consumer INTO\njx-plan-conformance\
        \ and registers against the isolated bus. Keep the chart's securityContext\nkyverno-compliant\
        \ (runAsNonRoot:true + numeric runAsUser + drop ALL caps + seccomp\nRuntimeDefault + readOnlyRootFilesystem)\
        \ \u2014 a name-only USER fails admission.\n\nTESTS: unit-test /consume_event (records + returns\
        \ the ConsumeEventResponse shape) and\n/confirmed (seen vs unseen). Extend end2end if the scaffold\
        \ has it. Keep chart render + lint\n+ govulncheck + security-scan green. Own the PR + drive BOTH\
        \ clusters' gates green THROUGH TO\nMERGE so the release cuts and the consumer deploys into jx-plan-conformance.\n"
      name: consumer-build
      repo: leartech-plan-conformance-consumer
    kind: pr
    name: build-consume
    repo: mikelear/leartech-plan-conformance-consumer
  - agentType: leartech-agent-infra
    dependsOn:
    - build-consume
    inputs:
      action: release-health-check
      budgetMinutes: 60
      healthPath: /health
      namespace: jx-plan-conformance
      service: leartech-plan-conformance-consumer
    kind: check
    name: release-monitor-consume
  tenant: leartech
  triggeredBy: human
