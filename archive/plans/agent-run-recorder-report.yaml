# ARCHIVED — NOT A CATALOG PLAN. Do not copy this as a pattern.
# Predates the current controller and catalog gate; see archive/README.md.
# Existed on: gcp, az
# Phase: gcp=Failed, az=Paused
# AgentRuns owned: gcp=5, az=0
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: agent-run-recorder-report
  namespace: jx-staging
spec:
  steps:
  - agentType: leartech-agent-go
    inputs:
      branch: feat/recorder-report
      goal: "Add the reporting half: turn a committed record into a narrative, post it to the run's PR,\
        \ and raise an issue when there is something a human should act on.\nCONFIRM THE PREMISE FIRST.\
        \ agent-run-recorder-core must have landed and the corpus must contain records. Read a real record\
        \ and build against its actual field names. If the corpus is empty, STOP and report it \u2014\
        \ do not design a record format here, it is defined by the other half.\nGO, INCLUDING THE MODEL\
        \ CALL. leartech-ai-gateway is OpenAI-compatible: GET /v1/models lists the models, POST /v1/chat/completions\
        \ is the call. That is an HTTP POST with JSON. Do not introduce Python and do not add an agent\
        \ SDK \u2014 this is one completion over a computed record, not a tool-using agent. Use the gateway's\
        \ `echo` model for any integration test so tests spend nothing.\nITS OWN VIRTUAL KEY. Provision\
        \ and consume a gateway key for this service alone, mirroring how the BA agent's key is wired\
        \ (an ExternalSecret whose target Secret supplies AI_GATEWAY_API_KEY). Separate so cost is attributable\
        \ per key, it rate-limits independently, and a runaway recorder cannot spend another consumer's\
        \ budget.\nWHAT THE NARRATIVE MUST CONTAIN. What happened; why it decided what it did, read off\
        \ the ordered trajectory; potential prompt changes; and what could not be established and why.\
        \ Split the prompt changes into MISMATCHES, each carrying the verbatim error that evidences it,\
        \ and CHOICE PATTERNS, each carrying the metric that evidences it. Do not merge them into one\
        \ list \u2014 a mismatch is nearly a fix, a choice pattern is a hypothesis, and presenting them\
        \ at equal confidence is how a wrong prescription gets applied.\nTHE MODEL EXPLAINS; IT DOES NOT\
        \ DETECT. Everything it is given is already computed. If the gateway call fails, post and commit\
        \ the deterministic content anyway and record the narrative as ABSENT. Never retro-fit a missing\
        \ narrative by guessing, and never let a model-written sentence assert something the record does\
        \ not contain.\nA PROMPT CHANGE IS A PROPOSAL. State it with its evidence and stop. Do not edit\
        \ docs/agent-system-prompt.md and do not open a PR against leartech-automated-agent from this\
        \ service. A change there goes through tests/test_prompt_contract.py like any other.\nTHE PR COMMENT.\
        \ Sticky \u2014 update the existing comment rather than adding one per run. It carries the prompt's\
        \ sha256, the permalink to the prompt at the commit the image was built from, and a link to the\
        \ committed record. The PR will usually be merged already; that is fine and expected, GitHub accepts\
        \ comments indefinitely and the next agent reads the PR. Never push to the PR branch.\nISSUES\
        \ ONLY WHEN THERE IS AN ACTION, AND NEVER TWICE. Raise them on mikelear/leartech-agent-run-reports\
        \ only, which keeps this service's token scoped to one repo. An issue is for something a human\
        \ or a later agent should act on, not a copy of every report. Update an existing open issue rather\
        \ than opening a duplicate, and say in the PR description how that was made idempotent.\nISOLATE\
        \ TESTING: table-driven Go tests, no network. Cover: mismatches and choice patterns rendering\
        \ as separate sections; a gateway failure still producing the deterministic output with the narrative\
        \ marked absent; the sticky comment updating rather than duplicating; an issue not being raised\
        \ when nothing fired; and an issue being updated rather than duplicated on a second pass. Non-negative\
        \ coverage delta.\nDone = PR merged (open via open_pr, drive gates green)."
      name: recorder-report
      repo: mikelear/leartech-agent-run-recorder
    kind: pr
    name: recorder-report
  - dependsOn:
    - recorder-report
    kind: check
    name: recorder-report-verify-release
    use: verify-release-flow
    with:
      pr: ${steps.recorder-report.pr}
      repo: mikelear/leartech-agent-run-recorder
      service: leartech-agent-run-recorder
  triggeredBy: plan-catalog-internal-services
