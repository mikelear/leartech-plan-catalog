# ARCHIVED — NOT A CATALOG PLAN. Do not copy this as a pattern.
# Predates the current controller and catalog gate; see archive/README.md.
# Existed on: gcp, az
# Phase: gcp=Failed, az=Paused
# AgentRuns owned: gcp=5, az=0
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: agent-run-cross-run-pass
  namespace: jx-staging
spec:
  steps:
  - agentType: leartech-agent-go
    inputs:
      branch: feat/cross-run-pass
      goal: "Add the cross-run pass: a second, less frequent run of this service that reads many committed\
        \ run records together and reports what is true ACROSS runs.\nCONFIRM THE PREMISE FIRST, AND STOP\
        \ IF IT IS ABSENT. This depends on the per-run pass already writing records to mikelear/leartech-agent-run-reports.\
        \ The corpus is CLUSTER-SCOPED: runs/<cluster>/<utc-date>/<run-id>.json, where <cluster> is the\
        \ CLUSTER_ID (gcp|az). Do not assume runs/<utc-date>/ \u2014 that was the layout before the paths\
        \ were cluster-scoped, and reading it would find nothing. List runs/ and then one level down to\
        \ see the real shape for yourself, and read the actual JSON to learn the real field names. If\
        \ the corpus is empty or the per-run pass is not implemented yet, STOP and say so in the PR description\
        \ \u2014 do NOT invent a record format and do not build against a schema you designed yourself.\
        \ The whole value of this pass is that it reads what the other pass actually wrote.\nDECIDE AND\
        \ STATE WHETHER YOU COMPARE WITHIN A CLUSTER OR ACROSS BOTH. Because the corpus is cluster-scoped,\
        \ \"across runs\" is ambiguous and the choice changes what a finding means: the two clusters run\
        \ different image streams and different MCP server versions, so a metric shift between them can\
        \ be a cluster difference rather than a regression. At the time of writing only runs/gcp/ exists.\
        \ Pick one, justify it in the PR description, and make the report say which runs it covered.\n\
        SAME BINARY, SECOND SUBCOMMAND, SECOND CRONJOB. Do not create a new service. Reuse this repo's\
        \ existing structure \u2014 app/, charts/, .lighthouse. For the CronJob-in-its- own-chart pattern,\
        \ leartech-code-audit is the estate's precedent. Follow it for that SHAPE ONLY: it carries two\
        \ presubmits where mcp-servers, plan-api and orchestrator-controller all carry ten, so it is the\
        \ estate's under-gated outlier and must not be used as the reference for gates, pipelines or triggers.\
        \ Modelling this repo on it is exactly how recorder-core shipped with three gates instead of eight.\
        \ The schedule is less frequent than the per-run pass; choose it and justify it in the PR description.\n\
        GO, INCLUDING THE MODEL CALL. leartech-ai-gateway is OpenAI-compatible (GET /v1/models lists models,\
        \ POST /v1/chat/completions is the call), so the narrative is an HTTP POST with JSON. Do not introduce\
        \ Python. Do not add an agent SDK \u2014 this is one completion over a computed comparison, not\
        \ a tool-using agent.\nDETECTION IS DETERMINISTIC; THE MODEL ONLY EXPLAINS. Compute every comparison\
        \ in Go and pass the model the computed result plus the verbatim evidence. At minimum: the same\
        \ tool-error class recurring across records; a metric compared between records grouped by prompt\
        \ sha256; a metric trending across records; and an advertised tool with zero calls across consecutive\
        \ records. If the gateway call fails, the deterministic comparison must still be written and the\
        \ narrative recorded as ABSENT \u2014 never inferred, never retro-fitted.\nOUTPUT, AND DO NOT\
        \ CREATE NOISE. Write a period report into the corpus alongside the per-run records, and raise\
        \ a GitHub issue ONLY when a rule fires and only on mikelear/leartech-agent-run-reports (which\
        \ keeps this service's token scoped to one repo). It runs repeatedly over an overlapping window,\
        \ so it MUST NOT open a duplicate issue for a finding it has already raised \u2014 update the\
        \ existing open issue instead. Say in the PR description how you made that idempotent.\nTREND\
        \ THE RECORDER'S OWN COVERAGE \u2014 THIS IS HOW A FUTURE GAP GETS CAUGHT. Every per-run record\
        \ carries how much of its run was actually readable: total lines for the pod, lines the structured\
        \ query parsed, and lines per source. Treat those as first-class metrics and compare them across\
        \ runs exactly as you compare the behavioural ones.\nThe reason is that gaps in observability\
        \ cannot be enumerated in advance. MCP servers get added, a field gets renamed, a prompt change\
        \ makes the agent use a tool that logs nothing, an image change drops a log call. Each is invisible\
        \ in a different way and none can be written as a rule beforehand. But all of them move the coverage\
        \ numbers, and a move is detectable without knowing the cause \u2014 the same reason the wait-tool\
        \ ratio caught a prompt contradiction nobody predicted.\nATTRIBUTE THE DROP, DO NOT JUST REPORT\
        \ IT. Each record carries the prompt sha256, the agent image tag and the MCP inventory. When coverage\
        \ falls, group by those the way you group behavioural metrics by prompt sha, and say what changed\
        \ alongside it. \"Parse rate fell from 96 percent to 48 percent at image 0.51.0\" is actionable;\
        \ \"parse rate is 48 percent\" is not.\nA SOURCE THAT SHOULD HAVE LOGGED AND DID NOT IS A FINDING.\
        \ Zero lines from a source the run demonstrably exercised \u2014 MCP calls happened and mcp-servers\
        \ logged nothing, an AgentRun reached a terminal phase and the controller logged no transition\
        \ \u2014 is different from zero lines from a source the run never touched. Distinguish them. In\
        \ the baseline, 43 MCP calls produced 12 mcp-servers lines.\nNO SILENT CAPS. If the pass reads\
        \ only the last N records, or skips records it could not parse, the report must say so explicitly.\
        \ A report that silently covered less than it appears to reads as \"nothing found\" when it means\
        \ \"did not look\".\nA PROMPT CHANGE IS A PROPOSAL. If the comparison suggests the prompt should\
        \ change, say so with the evidence and stop there. Do not edit docs/agent-system-prompt.md from\
        \ this service and do not open a PR against leartech-automated-agent automatically.\nISOLATE TESTING:\
        \ table-driven Go tests, no network and no cluster. Use the gateway's `echo` model only if an\
        \ integration test is genuinely needed; unit tests must not call the gateway at all. Cover each\
        \ rule firing and not firing, the grouping by prompt sha, issue idempotency, and that a gateway\
        \ failure still yields the deterministic report. Non-negative coverage delta.\nDone = PR merged\
        \ (open via open_pr, drive gates green)."
      name: cross-run-pass
      repo: mikelear/leartech-agent-run-recorder
    kind: pr
    name: cross-run-pass
  - dependsOn:
    - cross-run-pass
    kind: check
    name: cross-run-pass-verify-release
    use: verify-release-flow
    with:
      pr: ${steps.cross-run-pass.pr}
      repo: mikelear/leartech-agent-run-recorder
      service: leartech-agent-run-recorder
  triggeredBy: plan-catalog-internal-services
