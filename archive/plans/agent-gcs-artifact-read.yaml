# ARCHIVED — NOT A CATALOG PLAN. Do not copy this as a pattern.
# Predates the current controller and catalog gate; see archive/README.md.
# Existed on: gcp, az
# Phase: gcp=Paused, az=Paused
# AgentRuns owned: gcp=0, az=0
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: agent-gcs-artifact-read
  namespace: jx-staging
spec:
  paused: true
  steps:
  - agentType: leartech-agent-go
    inputs:
      branch: feat/agent-gcs-secret
      goal: "Let a spawned agent Job read GCS by projecting an OPT-IN GCS credential, following the AuthClientSecretName\
        \ precedent exactly.\nCRD (api/v1alpha1/agenttype_types.go): add two optional fields to AgentTypeSpec\
        \ \u2014 GcsSecretName and GcsSecretKey. Document them the way the existing pairs are documented:\
        \ they name a Secret and key, never a credential value.\nJOBSPAWN (internal/controller/jobspawn.go):\
        \ project GOOGLE_APPLICATION_CREDENTIALS_JSON from that Secret via secretEnv, in the same block\
        \ as GH_TOKEN / ANTHROPIC_API_KEY. Make it OPT-IN with NO default, exactly like LEARTECH_AUTH_CLIENT_SECRET\
        \ \u2014 the existing comment explains why: \"so an MCP-less AgentType or a preview namespace\
        \ without the secret does not wedge the Job on a missing Secret\". The same reasoning applies\
        \ here: most agent types never touch GCS, and preview namespaces may not have the Secret. Default\
        \ the KEY only (key.json), matching how defaultAuthClientSecretKey works.\nCHART: add an `agentTypes.gcs`\
        \ block to values.yaml mirroring the shape and comment style of the existing `agentTypes.mcpAuth`\
        \ block (enabled / secretName / secretKey, disabled by default, per-cluster GitOps overlays turn\
        \ it on). When enabled, render gcsSecretName + gcsSecretKey onto every AgentType in templates/agenttypes.yaml,\
        \ the same way mcpAuth renders authClientSecretName/Key. Default secretName to test-artifacts-gcs-key\
        \ and secretKey to key.json in the values comment, but do NOT hardcode them into the template.\n\
        DO NOT add a volume/volumeMount \u2014 AgentTypeSpec has no volumes field and adding one is a\
        \ much larger change than this needs. Env projection is the established pattern and is sufficient:\
        \ the agent writes the JSON to a file and points GOOGLE_APPLICATION_CREDENTIALS at it, which is\
        \ what gcloud and gsutil expect.\nISOLATE TESTING: unit tests on buildJob asserting (a) no GCS\
        \ env is projected when GcsSecretName is empty \u2014 the wedge-avoidance property, (b) the env\
        \ IS projected with the right secretKeyRef name/key when set, (c) the key defaults while the name\
        \ does not. Plus a chart render test asserting the fields are absent when agentTypes.gcs.enabled\
        \ is false and present when true, mirroring the existing mcpAuth chart tests. Runnable with `go\
        \ test ./...` \u2014 no cluster.\nLOGGING TO VERIFY: log at Job construction whether a GCS credential\
        \ was projected (secret name only, never the value) so a \"why can't the agent read the bucket\"\
        \ question is answerable from Loki. Done = PR merged (open via open_pr, drive gates green)."
      name: controller-gcs-secret
      repo: mikelear/leartech-orchestrator-controller
    kind: pr
    name: controller-gcs-secret
  - agentType: leartech-agent-go
    inputs:
      branch: feat/agent-gcs-secret
      goal: "Enable the agent GCS credential for the GCP cluster. In helmfiles/jx-staging/configs/leartech-orchestrator-controller.yaml\
        \ set the new agentTypes.gcs block: enabled true, secretName test-artifacts-gcs-key, secretKey\
        \ key.json.\nThat Secret is already present in jx-staging (ESO-synced) and is the same one the\
        \ Observer and end2end-ui catalog tasks use to upload artifacts, so no new secret, ExternalSecret\
        \ or GSA is required. Comment the block explaining that it exists so agents can READ artifact\
        \ bundles referenced by a Plan, and that the same Secret is the CI artifact writer.\nAlso declare,\
        \ in whatever this repo uses for bucket configuration, the artifact bucket and its IAM: gs://artifacts-product-first\
        \ (private, US-EAST1, no public access) with roles/storage.objectAdmin for test-artifacts-writer@product-first.iam.gserviceaccount.com.\
        \ Both were created by hand during the 2026-08-09 smoke test and are currently UNDECLARED \u2014\
        \ a cluster rebuild would lose them and the failure mode is a 403 long after anyone remembers\
        \ why. If bucket IAM is not owned by this repo, say so in the PR description and leave it out\
        \ rather than guessing at a home for it. Done = PR merged (open via open_pr, drive gates green)."
      name: enable-gcs-gsm
      repo: mikelear/jx-build-cluster-gsm
    kind: pr
    name: enable-gcs-gsm
  - agentType: leartech-agent-go
    inputs:
      branch: feat/agent-gcs-secret
      goal: "Mirror enable-gcs-gsm for the Azure cluster: set the same agentTypes.gcs block on leartech-orchestrator-controller's\
        \ config. Confirm the Secret exists in that cluster's jx-staging first \u2014 if ESO does not\
        \ sync test-artifacts-gcs-key there, say so in the PR description rather than enabling a projection\
        \ that would wedge Jobs on a missing Secret. The artifact bucket stays on GCS regardless of which\
        \ cluster the agent runs on, so the credential is the same. Keep the two cluster configs at parity\
        \ field-for-field. Done = PR merged (open via open_pr, drive gates green)."
      name: enable-gcs-akv
      repo: mikelear/jx-build-cluster-akv
    kind: pr
    name: enable-gcs-akv
  - agentType: leartech-agent-ng
    dependsOn:
    - controller-gcs-secret
    - enable-gcs-gsm
    inputs:
      branch: feat/verify-gcs-read
      goal: "Prove a spawned agent can now read an artifact bundle from GCS. This step is itself the test\
        \ \u2014 it runs as a normal dev agent, so if it can read the bundle then any agent can. Verification\
        \ only: do NOT open a PR and do NOT modify the repo. FAIL (exit non-zero) if ANY assertion fails;\
        \ the verdict is this step's exit code.\nSetup: GOOGLE_APPLICATION_CREDENTIALS_JSON should be\
        \ present in your environment. Write it to a file and export GOOGLE_APPLICATION_CREDENTIALS pointing\
        \ at that file \u2014 that is what gcloud and gsutil expect. If the variable is ABSENT, fail immediately\
        \ and say so: it means the projection did not reach this Job, which is the whole point of the\
        \ change.\nAssertions against gs://artifacts-product-first/artifact/84a0eddb-5d20-4322-87c5-afebbae2c176/1/\
        \ : - manifest.json is readable and its label is exactly \"shipproven-website-visual-layer\".\
        \ - The file list in the manifest matches what is actually in the bucket prefix. - Download refs/plan-graph-deep-pipeline.png\
        \ and confirm its sha256 equals the value\n  recorded for it in the manifest \u2014 proving integrity,\
        \ not just reachability.\n- tokens.json parses and contains ink #0B1F3A. This is the specific\
        \ value the\n  2026-08-10 run invented as #0B1220, so it is the sharpest single proof that a real\n\
        \  agent can now obtain what it previously guessed.\n- An UNAUTHENTICATED fetch of the same object\
        \ returns 403, confirming the bucket is\n  still private and the read is genuinely credentialed.\n\
        \nReport each assertion pass/fail explicitly in the step output."
      name: verify-agent-can-read
      repo: mikelear/leartech-ship-proven-website
    kind: check
    name: verify-agent-can-read
  - dependsOn:
    - controller-gcs-secret
    kind: check
    name: controller-gcs-secret-verify-release
    use: verify-release-flow
    with:
      pr: ${steps.controller-gcs-secret.pr}
      repo: mikelear/leartech-orchestrator-controller
      service: leartech-orchestrator-controller
  - dependsOn:
    - enable-gcs-gsm
    kind: check
    name: enable-gcs-gsm-verify-release
    use: verify-release-flow
    with:
      pr: ${steps.enable-gcs-gsm.pr}
      repo: mikelear/jx-build-cluster-gsm
      service: jx-build-cluster-gsm
  - dependsOn:
    - enable-gcs-akv
    kind: check
    name: enable-gcs-akv-verify-release
    use: verify-release-flow
    with:
      pr: ${steps.enable-gcs-akv.pr}
      repo: mikelear/jx-build-cluster-akv
      service: jx-build-cluster-akv
  triggeredBy: plan-catalog-internal-services
