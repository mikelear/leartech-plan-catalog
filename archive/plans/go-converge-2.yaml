        pre-existing issues, do NOT silence linters). Lean diff, no service behaviour change. Own

        the PR, drive BOTH clusters green THROUGH TO MERGE.

        '
      name: go-converge2-adopt-mcp
      repo: leartech-mcp-servers
    name: adopt-mcp
    repo: mikelear/leartech-mcp-servers
  tenant: leartech
