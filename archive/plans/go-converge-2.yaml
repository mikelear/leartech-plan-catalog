        \ it byte-for-byte: tasks/go-lint/pullrequest.yaml and\ntasks/go-test/pullrequest.yaml.\nTargets\
        \ in go/leartech-go.mk:\n- GOLANGCI_VERSION := 2.12.2 (the ONE canonical version; the `tasks`\
        \ step bumps the go-lint\n  task image UP to match. Reference it in the README as canonical.)\n\
        - lint-config: curl go/.golangci.base.yml + yq deep-merge the consumer ./.golangci.yml\n  (base\
        \ *+ local, local wins) \u2192 .golangci.merged.yml; base-only if no local file.\n- lint: depends\
        \ lint-config \u2192 `golangci-lint run -v --timeout 15m --config\n  .golangci.merged.yml ./...`\
        \ (IDENTICAL to the task).\n- test-coverage: `go test ./... -v -count=1 -race -coverpkg=$(COVERAGE_SCOPE)\n\
        \  -coverprofile=cover.out` (COVERAGE_SCOPE?=./internal/..., COVERAGE_THRESHOLD?=60.0,\n  COVERAGE_DELTA_TOLERANCE?=0.5);\
        \ strip generated files; enforce floor; delta-vs-base\n  EXACTLY as the task but GUARD base-clone/delta\
        \ to no-op cleanly offline. No PR-comment\n  posting here (stays in task).\n- vet, tidy-check,\
        \ vuln, test, build, pre-push (`vet tidy-check build test-coverage lint\n  vuln`). Runnable via\
        \ `make -f leartech-go.mk <t>` AND `include`.\nAdd a parity test asserting the merged linter set\
        \ equals today's (refactor, not a rule\nchange). Lean diff. Own the PR, drive BOTH clusters green\
        \ THROUGH TO MERGE.\n"
