        \ ctx key so the forwarder picks up the caller token.\n   Verify the whole path: inbound /mcp/plan\
        \ tool call \u2192 ctx \u2192 client.do() attaches\n   `Authorization: Bearer <caller token>`\
        \ to the plan-api request.\n2. Add a unit/integration test proving that when a call arrives with\
        \ a Bearer, the\n   outbound plan-api request carries that same Bearer (not empty, not s2s).\n\
        Do NOT weaken the inbound fail-closed authz. Keep the s2s fallback for peer/no-bearer\ncalls but\
