# A second AI review that looks at the RENDERED PAGE, not the diff — fed by the Playwright
# artifacts we already upload, plus the PR's own preview namespaces. ADVISORY ONLY.
#
# WHY THIS PLAN EXISTS
# Today `ai-review` reviews the DIFF. A design review of the live site on 2026-09-02 found
# five defects that a diff cannot show and that end2end-ui/07-shipproven-landing.spec.ts did
# not catch, because it asserts the PRESENCE OF TEXT, not rendered geometry:
#   · "METERED · VIRTUAL KEYS" clipped by the Gateway box edge (consensus diagram)
#   · "providers must agree" overflowing the Quorum box; "rules on the set" overflowing Meta-judge
#   · the arrow leaving Meta-judge running off the panel edge
#   · "MORE" truncated to "MOR" on the tier-staircase arrows
#   · the top nav wrapping raggedly at 1440px (three items break to two lines, uneven baselines)
# All five were found by a human taking screenshots. That is the thing to automate — same
# shape as the recorder work: do it by hand, prove it finds real defects, then automate what
# reproduces the manual result.
#
# ⭐ THE ARCHITECTURAL DECISION THAT MAKES THIS BUILDABLE NOW
# The review MUST run as a PIPELINE TASK (like `tasks/ai-review`), NOT as a spawned agent.
#   · A pipeline task can read the bucket TODAY: `test-artifacts-gcs-key` is ESO-synced into
#     jx-staging and jx, and the Observer + end2end-ui tasks already use it to UPLOAD
#     artifacts via `gsutil -o "Credentials:gs_service_key_file=..."`. Same credential, read side.
#   · A SPAWNED AGENT cannot: jobspawn.go projects secrets as named pairs per purpose
#     (GitHub/Anthropic/AuthClient) and there is NO GCS pair, so the agent pod's `default` SA
#     hits the unbound Workload Identity pool and gets HTTP 403. That is the open Plan
#     plans/agent-gcs-artifact-read.yaml, and it is exactly what caused the 2026-08-10
#     `shipproven-website-visual` failure (0-byte listing, silent give-up, invented brand ink).
#   ⇒ Building this as a pipeline task SIDESTEPS that blocker entirely. Do not wait for it,
#     and do not implement this as an agent step.
#
# WHAT IT REVIEWS — three inputs, which is the whole point
#   1. THE ARTIFACTS already in GCS from end2end-ui: screenshots, plus a NEW structured
#      JSON summary that step 1 adds.
#   2. THE LIVE PREVIEW NAMESPACES for this PR — and there are TWO, one per cloud:
#      leartech-ship-proven-website-pr<N>.jx.leartech.com and ...pr<N>.az.leartech.com.
#      Fetching both means the review can DIFF THE TWO CLOUDS: divergent rendered output is
#      itself a finding (an environment defect, not a code defect). Multi-cloud used as a
#      verification signal at the review layer.
#   3. THE DIFF, for context only — `ai-review` already owns code review; this must not
#      duplicate it. Different job, different comment.
#
# ⚠️ DIVISION OF LABOUR — our own thesis, applied to our own pipeline.
# Do NOT ask a model to do what a deterministic check can do.
#   · PLAYWRIGHT ASSERTS the objectively checkable (step 1): overflow, computed opacity,
#     focusability, contrast ratios, axe violations, layout at fixed viewports.
#   · THE MODEL JUDGES THE RESIDUE (step 2): hierarchy, legibility at video scale, whether a
#     diagram earns its space, whether emphasis lands on the right element.
# A deterministic failure should be reported as a fact, never as a model opinion.
#
# ⚠️ DO NOT FEED THE TRACE FILE TO A MODEL. A Playwright trace is a zip; a model cannot read
# it usefully and it burns tokens for nothing. Traces stay in GCS for humans. The model gets
# PNGs and the JSON summary, and the PNG set must be SELECTIVE (images are expensive).
#
# ⚠️ ADVISORY ONLY, AND THAT IS DELIBERATE. Visual input becomes a flake generator without
# pinned viewports, frozen animation and thresholds. Exit 0 unconditionally. Prove the
# false-positive rate before anyone proposes gating on it — the same discipline as the
# classifier, which is still advisory with a documented TODO to gate at >=80% eval accuracy.
#
# VERIFICATION — auto-injected, NOT hand-authored (R23/R24).
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: shipproven-ui-visual-ai-review
spec:
  paused: true
  steps:
    - name: visual-evidence-specs
      kind: pr
      agentType: leartech-agent-ng
      inputs:
        name: visual-evidence-specs
        repo: mikelear/leartech-ship-proven-website
        branch: feat/visual-evidence-specs
        goal: >-
          Make end2end-ui produce evidence a reviewer can reason about, and fix the spec
          hygiene while you are in there.

          1. RETIRE THE INHERITED AUTH SPECS. This repo took the golden template's suite
          verbatim and carries five specs for features a static marketing site does not
          have: 02-login-flow, 03-fleet-status, 04-sign-out, 05-token-claims,
          06-fleet-status-authenticated. Delete them. If any is currently passing, say so in
          the PR description — a passing test for a feature that does not exist is worse than
          no test, because it reads as coverage.

          2. ADD THE TWO MISSING RESPONSIVE SPECS the golden template has and this repo
          dropped: responsive-shell and responsive-nav. These are not optional hygiene — the
          top nav currently WRAPS RAGGEDLY at 1440px ("How it works", "The data moat" and
          "Why different" each break to two lines with uneven baselines), which is precisely
          what responsive-nav exists to catch. Assert nav items do not wrap at 1280px and
          1440px, and that the mobile nav is reachable at 375px.

          3. ADD A NEW SPEC: end2end-ui/10-visual-evidence.spec.ts. It does the DETERMINISTIC
          checks — every one of these is objectively true or false, so none of them needs a
          model:
            a. NO CLIPPED LABELS. For every element inside a diagram panel, assert
               scrollWidth <= clientWidth + 1 and scrollHeight <= clientHeight + 1. This is
               the check that catches all five overflow bugs above. Report the offending
               selector and both measurements on failure.
            b. REVEAL DEGRADES TO VISIBLE. Load the page with JavaScript DISABLED
               (browser.newContext({ javaScriptEnabled: false })) and assert every element
               carrying the reveal class has computed opacity 1. A blank card that still
               passes a raw-HTML grep is the failure mode this exists to prevent.
            c. MOTION CONTROLS. Any auto-playing element exposes a control that is present,
               focusable and toggles it (WCAG 2.2.2).
            d. REDUCED MOTION RESOLVES TO THE END STATE. With
               { reducedMotion: 'reduce' } assert the gate strip paints ALL gates passed and
               the verdict line reads authorised — never blank, never mid-sequence.
            e. CONTRAST. Computed contrast of every text node against its rendered
               background >= 4.5:1 (>= 3:1 for text over 18.66px bold / 24px regular).
            f. AXE. Run @axe-core/playwright and record violations.
          FLAKE CONTROL IS PART OF THE SPEC: pin viewports to exactly 375, 768 and 1440;
          freeze animation before any capture (add a style setting animation/transition
          duration to 0, or seek to a fixed timestamp); never assert on a timing race.

          4. EMIT THE EVIDENCE BUNDLE into the existing artifact directory that end2end-ui
          already uploads to GCS — do NOT invent a new upload path, do not add credentials:
            · visual-evidence.json — a single structured file: { pr, sha, cloud, viewport,
              checks: [{id, status, selector, expected, actual}], consoleErrors[],
              failedRequests[], axeViolations[], contrastFailures[] }. This is the file the
              reviewer parses.
            · SELECTIVE screenshots only — full-page at 1440 and 375, plus one per diagram
              panel. Deterministic filenames including the viewport. Do not screenshot every
              step; images are expensive downstream.
          Traces keep uploading as they do now, for humans. Commit
          docs/WEBSITE-VISUAL-EVIDENCE.md describing the bundle contract, since step 2
          depends on its shape.

    - name: design-review-task
      kind: pr
      agentType: leartech-agent-go
      dependsOn:
        - visual-evidence-specs
      inputs:
        name: design-review-task
        repo: mikelear/leartech-pipeline-catalog
        branch: feat/design-review-task
        goal: >-
          Add a shared, ADVISORY pipeline task `tasks/design-review` that reviews the
          RENDERED page — the counterpart to `tasks/ai-review`, which reviews the diff.
          Pattern-match tasks/ai-review for structure, gateway usage, virtual keys and
          metering; this must route model calls through the gateway exactly as it does. Read
          docs/review-format.md first.

          RUNS AS A PIPELINE TASK, NOT A SPAWNED AGENT — this is the load-bearing design
          decision. It therefore reads the artifact bucket with the SAME credential the
          Observer and end2end-ui tasks already use for upload
          (`test-artifacts-gcs-key`, `gsutil -o "Credentials:gs_service_key_file=..."`).
          Do not add a new GSA, do not touch Workload Identity, do not add terraform, and do
          NOT wait on plans/agent-gcs-artifact-read.yaml — that Plan fixes secret projection
          for spawned AGENT pods and is not on this path.

          INPUTS, in this order of authority:
            1. visual-evidence.json from GCS for this PR and sha (contract in the website
               repo's docs/WEBSITE-VISUAL-EVIDENCE.md). Deterministic results.
            2. The selective screenshots from GCS.
            3. BOTH live preview namespaces for the PR:
               <repo>-pr<N>.jx.leartech.com and <repo>-pr<N>.az.leartech.com. Fetch each and
               DIFF THEM. Divergent rendered output between clouds is a finding in its own
               right and must be labelled as an ENVIRONMENT defect, not a code defect — the
               previous Plan's two staging environments returned byte-identical output, so
               divergence is a real signal.
            4. The diff, for context only.

          HOW IT REVIEWS — respect the division of labour:
            · Deterministic failures from visual-evidence.json are reported AS FACTS, with
              the selector and the measured values. Never soften one into a model opinion,
              never re-litigate one with the model.
            · The model is asked ONLY for the judgement calls a check cannot make: visual
              hierarchy, legibility of diagram labels at video scale, whether a diagram earns
              its space, whether emphasis lands on the intended element, and whether motion
              reads as purposeful or decorative.
            · Do NOT re-review code quality. `ai-review` owns that. Post a SEPARATE comment
              so the two never collide.

          OUTPUT: a `leartech.review/v1` comment per docs/review-format.md — a fenced json
          block with verdict + findings[{severity, fix, refs}] so it parses like every other
          review in the estate, with the human-readable summary above it. Each finding cites
          its evidence: a check id, a screenshot filename, or a preview URL.

          ADVISORY: exit 0 UNCONDITIONALLY, whatever the verdict. It must be impossible for
          this task to block a merge in this iteration. Log a line naming the run's
          false-positive candidates so the rate can be measured before anyone proposes
          gating. Include a `docs/` note stating the gating precondition explicitly, mirroring
          the classifier's documented TODO.

          COST DISCIPLINE: cap the number of images sent to the model, downscale to a
          documented max dimension, and NEVER send a .zip trace — traces are for humans.
          Record token spend for the run so cost per review is visible from day one.

    - name: wire-design-review
      kind: pr
      agentType: leartech-agent-ng
      dependsOn:
        - design-review-task
      inputs:
        name: wire-design-review
        repo: mikelear/leartech-ship-proven-website
        branch: feat/wire-design-review
        goal: >-
          Wire the new shared task into this repo's pipeline as an advisory presubmit, the
          same way the ai-review task is consumed — a `uses:` ref to
          leartech-pipeline-catalog tasks/design-review under .lighthouse/jenkins-x/, running
          AFTER end2end-ui so the artifacts and both preview namespaces exist.

          It must be NON-BLOCKING: not a required status check, and its failure or absence
          must never hold a merge. `plan-lint`-style blocking is explicitly out of scope for
          this iteration.

          Then verify the loop end to end on this PR itself and record it in the PR
          description: the task ran, it found the artifacts in GCS, it fetched both preview
          namespaces, and it posted a leartech.review/v1 comment. If it could not read the
          bucket, say so plainly and do not paper over it with a partial review — a silent
          give-up on unreadable artifacts is the exact failure that closed PR #7 on this repo
          in August.

          Finally, update docs/WEBSITE-DESIGN.md with a short section: what design-review
          checks, what is deterministic versus model judgement, that it is advisory, and the
          precondition for ever gating on it.
