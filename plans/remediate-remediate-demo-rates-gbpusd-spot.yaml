# Remediate remediate-demo-rates-gbpusd-spot — the 0.0.2 promote failed closed on
# the az half of the estate (no promote PR at all: the repo was never registered
# on akv, so no az release ever fired), and the gcp promote PR was closed without
# merging. This plan re-runs the exact deterministic verification that failed
# (verify-release-flow, standalone — R23 allows the no-dependsOn form for an
# already-deployed service) and, when it passes, flips
# remediate-demo-rates-gbpusd-spot to Resolved (Spec.Remediates).
#
# ─────────────────────────────────────────────────────────────────────────────
# ROOT CAUSE (diagnosed 2026-10-28 from the failed AgentRun
# remediate-demo-rates-gbpusd-spot-verify-promote-merged, action promote-status,
# plus the promote PRs and both GitOps repos)
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT THE STEP SAW. The feature PR (mikelear/leartech-demo-rates#2) merged at
# 2026-10-27T18:50:43Z. The remediation Plan's standalone verify-release-flow
# ran; its promote-merged sub-step (action promote-status, cluster="" → both
# clusters) failed closed with reason FAIL at 2026-10-28T14:18:05Z.
#
#   az = NO PROMOTE PR AT ALL — the repo was never registered on akv. akv#2279
#     registered leartech-demo-rates at 14:07:24Z on 2026-10-23, but akv#2280
#     (register leartech-demo-board) was cut from a branch based BEFORE that
#     merge and its merge at 14:17:34Z REPLACED the demo-rates line with
#     demo-board. Current akv main has demo-board but NOT demo-rates. The
#     feature PR merged four days later with the repo invisible to az's
#     Lighthouse, so no az release fired, no az promote PR was ever opened, and
#     akv also never had the demo-rates helmfile entry or auth overlay.
#
#   gcp = PROMOTE PR CLOSED WITHOUT MERGE. gsm#2607 "chore: promote
#     leartech-demo-rates to version 0.0.2" was closed at 2026-10-27T20:16:15Z
#     carrying gcp/verify FAILURE (the missing-auth-overlay render failure the
#     previous remediation already diagnosed). gsm#2608 restored the overlay +
#     helmfile entry and merged at 19:42:05Z the same day, but the promote PR
#     #2607 itself was never re-triggered or merged — it was closed with the
#     verify still red. The 0.0.2 release entry is live on gsm main (landed via
#     #2608), so the gcp estate is healthy, but the promote-merged check has no
#     MERGED promote PR to observe.
#
# ─────────────────────────────────────────────────────────────────────────────
# GITOPS PREREQUISITES ARE AN OPERATOR PROCEDURE — NOT STEPS IN THIS PLAN
# ─────────────────────────────────────────────────────────────────────────────
#
# plan-lint R26 hard-blocks any step targeting jx-build-cluster-* from a plain
# Plan, and R22 blocks hand-authored infra agentTypes — the sanctioned homes for
# GitOps edits are OWNERS-gated PlanTemplates or an operator. This is a ONE-OFF
# restoration (needs-human:gitops-overlay), recorded here as the procedure (the
# agent-gcs-artifact-read precedent for exactly this shape):
#
#   GCP (jx-build-cluster-gsm) — ALREADY DONE. #2608 (overlay + helmfile entry
#     at 0.0.2) merged 2026-10-27T19:42:05Z; the 0.0.2 release entry is live on
#     gsm main with the overlay in its values list. The gcp estate needs
#     nothing further for this plan.
#   AZ (jx-build-cluster-akv) — TO BE OPENED:
#     1. Re-register leartech-demo-rates in .jx/gitops/source-config.yaml
#        under the mikelear/ group (it was clobbered by akv#2280). One line,
#        beside leartech-demo-board.
#     2. Add helmfiles/jx-staging/configs/leartech-demo-rates.yaml with the AZ
#        issuer (mirror leartech-third-party-api's akv overlay):
#            auth:
#              issuer: "https://hydra-jx-staging.az.leartech.com"
#              audience: "leartech-demo-rates"
#     3. Once registered, push an empty commit to the service repo's main (or
#        re-push the release sha) so the az postsubmit release fires; it will
#        tag its cluster-suffixed version and jx promote will open the akv
#        promote PR, which must carry the overlay in its values list (see
#        gsm#2608 for the shape) and drive az/verify + az/qa-gate green.
#   ORDER: land the akv registration + overlay BEFORE (or with) the az release
#     trigger, so the az promote PR can reference the overlay on its first
#     render.
#
# SYSTEMIC FOLLOW-UP (out of scope here, recorded so it is not lost): the
# bootstrap-authed-service template's register-auth-overlay action seeds the
# overlay ONCE at bootstrap; nothing re-seeds it after a teardown+re-register
# cycle, and jx promote cannot know a chart requires an overlay. A follow-up
# Plan/PlanTemplate should make the promote path fail EARLY (or the register
# action idempotently re-assert the overlay), so the next teardown+re-register
# does not rediscover this the hard way. Same for the akv merge-order clobber:
# akv#2280 was cut before akv#2279 — rebase-before-merge on the GitOps repos
# would have prevented it.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS PLAN EXECUTES
# ─────────────────────────────────────────────────────────────────────────────
#
# ONE standalone verify-release-flow expansion (R23: a use: verify-release-flow
# that does NOT dependsOn a PR step — verifying an already-deployed service by
# explicit PR — is legitimate; there is no deployable PR step in this Plan for
# the platform's auto-injection to duplicate). It re-runs the four deterministic
# checks that failed, per cluster, against the merged service PR #2:
#   release-passed   — release fired + passed (gcp already green; az once
#                      registered + triggered)
#   promote-merged   — promote PRs opened on BOTH GitOps repos, green, merged
#                      (this is the check that failed closed)
#   bootjob-ran      — a boot Job reconciled the promote commit
#   deploy-healthy   — the NEW promoted version is deployed + healthy per
#                      cluster, version-matched (fails closed, never
#                      version-blind)
# Each carries onFailure: escalate ba (from the template), so a still-red estate
# escalates rather than silently passing. When ALL FOUR pass the Plan Succeeds
# and the controller flips remediate-demo-rates-gbpusd-spot to Resolved with
# ResolvedBy pointing here.
#
# Hold-by-default (R5). This catalog Plan is a PROPOSAL. It lands paused; a
# human unpauses it AFTER the operator prerequisites above have merged (at
# minimum the akv registration + overlay, so the az checks can pass on the
# first run instead of escalating).
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: remediate-remediate-demo-rates-gbpusd-spot
  namespace: jx-staging
spec:
  paused: true
  remediates:
    - name: remediate-demo-rates-gbpusd-spot
      namespace: jx-staging
  steps:
    - name: verify
      kind: check
      use: verify-release-flow
      with:
        repo: mikelear/leartech-demo-rates
        pr: "2"
        service: leartech-demo-rates
