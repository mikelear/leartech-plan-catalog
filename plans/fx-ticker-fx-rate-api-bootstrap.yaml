# Bootstrap leartech-fx-rate-api — the go back end of the fx-ticker Project.
#
# Graduated from leartech-project-fx-ticker: domain "rate", persistence "postgres".
# Rationale: serves GBP/USD from a public FX API, caches history in Postgres
#
# Bootstrap only: create from the golden template, register both clusters,
# scaffold, drive ONE green PR. verify-release-flow is auto-injected (R23).
# The service FEATURE is a separate judged Plan against the repo this creates.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fx-ticker-fx-rate-api-bootstrap
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-fx-rate-api
        templateRepo: leartech-go-service-template
        namespace: jx-staging
