# Take the ShipProven marketing site (www.shipproven.com) to GA: wire the two
# now-LIVE reference builds into the Showcase and finish the launch essentials.
#
# WHY THIS PLAN EXISTS
# The content + crawlability (prerender/SSG + SEO) and the brand visual layer have
# landed. Two things are now unblocked or still open:
#   1. The two Showcase reference builds went LIVE + content-complete (2026-08-11):
#      - Mortgage Sourcing  https://mortgagesourcing.com  — "built for AI": a clean
#        human site PLUS a machine-readable MCP endpoint (ChatGPT/Claude/Cursor),
#        llms.txt, live UK rates. This IS the consumer site that was previously only
#        "being built on top of the MCP" — it can now be linked as the proof.
#      - NextGen Lending  https://www.nextgenlending.co.uk  — "a new lender on its
#        own programmable core-banking chain": EVM core-banking, on-chain
#        mortgage/savings contracts, oracle->fiat, a LIVE block explorer, ShipProven
#        APIs. Content-complete.
#      The Showcase currently carries [PLACEHOLDER] proof blocks — replace them with
#      real "View live" click-throughs + short captions.
#   2. Launch essentials still open per WEBSITE-DESIGN §0/§6: Design agent still shows
#      "Prototype" (it went LIVE 2026-08-11 — it rebuilt this very site); the agent-bus
#      label still reads "Maestro" (external brand is now "Axon"); the pipeline diagram
#      is a flat gate stack (should be the escalating repo->test->prod staircase with a
#      human GitOps prod-promotion); plus legal pages, working CTAs/forms, launch assets,
#      a11y/perf/security hardening.
#
# HONESTY GUARDRAIL (hard). Both reference sites are LIVE, fully-built DEMONSTRATIONS —
# proof of what ShipProven produces, NOT paying customers and NOT trading companies.
# Every Showcase caption must say so. This SUPERSEDES the older "LearTech only in the
# Showcase" wording: LearTech must appear NOWHERE on the public site (related-party
# optics) — grep-zero in built output.
#
# OUT OF SCOPE (deliberately not steps here): DNS is infra/GitOps, not a change to this
# repo — handled separately: (a) confirm www.shipproven.com resolves + canonical-redirects;
# (b) fix www.mortgagesourcing.com, which currently does NOT resolve (apex mortgagesourcing.com
# only) — add a www record + canonical redirect. Per R22 infra work is template-only, so it
# is not hand-authored in this Plan.
#
# VERIFICATION — auto-injected, deliberately NOT hand-authored (R23/R24): the platform
# auto-composes verify-release-flow after every deployable PR step, wired to the real merged
# PR. Both steps below are plain PR steps; release/deploy verification arrives on submission.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: shipproven-website-ga-finishing
spec:
  paused: true
  steps:
    - name: content-and-showcase
      kind: pr
      agentType: leartech-agent-ng
      inputs:
        name: content-and-showcase
        repo: mikelear/leartech-ship-proven-website
        branch: feat/ga-content-and-showcase
        goal: >-
          Finish the ShipProven marketing site content for GA. docs/WEBSITE-CONTENT.md is
          the source of truth for wording and docs/WEBSITE-DESIGN.md for structure — read
          both first. Do NOT weaken crawlability: .lighthouse/jenkins-x/seo-preview.yaml is a
          BLOCKING presubmit that fetches raw HTML with no JS and asserts the hero h1, the
          meta set, robots.txt and sitemap.xml — keep prerender/SSG (outputMode: static),
          no JS-only routes, no content behind interaction.

          1. SHOWCASE — wire the two now-LIVE reference builds (WEBSITE-CONTENT.md §7).
          Replace BOTH [PLACEHOLDER] proof blocks with real, working "View live"
          click-throughs and a one-line caption each. Also update docs/WEBSITE-CONTENT.md §7
          in the same PR so the source of truth no longer says [PLACEHOLDER].
            - Card 1 "Mortgage Sourcing — AI-native + MCP": link https://mortgagesourcing.com
              (the consumer site is now live). Show the MCP endpoint in mono
              (api.mortgagesourcing.com). Frame: a production-grade, AI-native, MCP-native
              fintech platform built through the governed pipeline.
            - Card 2 "NextGen Lending — chain-native": link https://www.nextgenlending.co.uk .
              Feature the live block explorer and that AI-generated smart contracts are
              consensus-reviewed + gate-verified before they deploy.
            - HONESTY: each card's caption must state it is a LIVE, fully-built demonstration —
              PROOF OF CAPABILITY, NOT a customer and NOT a trading company. Add the existing
              "we ship a new proof regularly" line. Do not over-claim "DeFi".

          2. REMOVE LEARTECH ENTIRELY. Remove the "Reference customer: LearTech ..." line
          beneath the Showcase and grep -ri "leartech" across templates/content/meta/OG/JSON-LD
          — there must be ZERO occurrences in the built output. Footer/eyebrow attribution is
          ShipProven · by Verrian only ("SHIPPROVEN · BY VERRIAN" eyebrow; footer "a product of
          Verrian Ltd, UK").

          3. DESIGN AGENT = LIVE. The Design agent went live 2026-08-11 (it rebuilt this site).
          Flip its status from "Prototype" (amber) to "Live" (green) in the agent roster, and
          ensure the agent-org diagram shows ALL SIX agents (BA, Dev, QA, Infra, Scrum-Master,
          Design) as Live. No "Prototype" pill may remain anywhere on the site.

          4. AGENT-BUS LABEL Maestro -> Axon. Rename the visible bus LABEL from "Maestro" to
          "Axon" across the site (diagram + any copy/nav/alt text). BRAND LABEL ONLY — do NOT
          touch any code, repo, CRD or env var (the underlying maestro implementation is a
          separate future task). No public-facing "Maestro" string may remain.

          5. LAUNCH ASSETS + ATTRIBUTION. Ensure og-default.png (1200x630) returns 200 (og:image
          already points at it); add favicon + app icons (16/32/apple-touch/maskable), a web
          manifest and theme-color. Keep the brand palette consistent with the deck and both
          reference sites (ink #0B1F3A, signal-green #16A34A accent).

          6. UK LEGAL + COMPANY DETAILS. Add Privacy Policy, Cookie Policy (GDPR/PECR) and Terms
          pages, linked in the footer. Footer must carry the company details: Verrian Ltd,
          company registration number, registered office. Add a cookie-consent banner IF (and
          only if) any non-essential cookies/analytics are set.

          7. NO DEAD BUTTONS — wire every CTA. "Book a walkthrough" -> a calendar link;
          "Talk to sales"/Contact -> a contact form or the verified sales@verrian.co.uk address;
          "Join the waitlist" -> a waitlist form with spam protection. Route form submissions to
          the ShipProven-built CRM (dogfood) or a monitored inbox. No CTA may be a dead link.

          ISOLATE TESTING: extend the end2end-ui specs to assert, against the PR preview: both
          Showcase "View live" links resolve over HTTPS and carry the proof-of-capability
          caption; ZERO "leartech" and ZERO "Maestro" in the rendered output; all six agents
          render Live with no Prototype pill; og-default.png returns 200; Privacy/Cookie/Terms
          pages exist and are linked; every CTA resolves to a real destination. No new infra.

          REPORT in the PR description exactly what you changed per section, what you removed
          (LearTech hits, Maestro labels), and where form submissions are routed.

          Done = PR merged (open via open_pr, drive gates green, seo-preview included).

    - name: visuals-and-quality
      kind: pr
      agentType: leartech-agent-ng
      dependsOn: [content-and-showcase]
      inputs:
        name: visuals-and-quality
        repo: mikelear/leartech-ship-proven-website
        branch: feat/ga-visuals-and-quality
        goal: >-
          Finish the ShipProven site visuals + launch-quality gate for GA. Read
          docs/VISUAL-BUILD-SPEC.md, docs/WEBSITE-DESIGN.md and docs/VISUAL-STARTER.md first.
          Do NOT change the copy (docs/WEBSITE-CONTENT.md is source of truth) and do NOT weaken
          the blocking .lighthouse/jenkins-x/seo-preview.yaml presubmit (keep prerender/SSG,
          hero h1, meta, robots.txt, sitemap.xml intact).

          1. ESCALATING-GATES PIPELINE DIAGRAM (VISUAL-BUILD-SPEC §4). Replace the flat gate
          stack with the escalating staircase: one set of gates to ENTER the repo, MORE to
          reach a TEST environment, MORE AGAIN to reach PRODUCTION — with the final prod
          promotion drawn as a deliberate HUMAN GitOps change (human-in-the-loop at the prod
          boundary), and reversibility shown (revert the PR / re-pin the prior version). This
          is the "software-DD standard" story. Render as INLINE SVG (prerender-safe, themeable,
          crawlable) — not <img>, not canvas, not a JS chart lib. Honour prefers-reduced-motion
          and give the diagram accessible alt/aria text. Also deliver the sanitised gateway
          consensus fan-out render (review -> gateway -> parallel models across providers ->
          quorum -> meta-judge -> verdict).

          2. SANITISATION — HARD REQUIREMENT (WEBSITE-DESIGN §4.6). This is a PUBLIC site. No
          internal hostnames, IPs, GCS paths, *.jx.leartech.com preview hosts, cluster tags or
          real repo/PR ids may appear in any rendered SVG or markup. Replace with neutral values.

          3. LAUNCH-QUALITY GATE (WEBSITE-DESIGN §6):
            - Accessibility WCAG 2.2 AA — explicitly verify #16A34A green contrast on white AND
              on #F3F6F9 (the known risk); keyboard nav + visible focus; skip-link; alt/aria on
              all SVGs; prefers-reduced-motion respected.
            - Responsive — hero visual stacks, nav -> hamburger; test the breakpoints.
            - Performance — good Core Web Vitals; font preload + font-display: swap; optimise SVG;
              keep critical-CSS on.
            - Security headers via nginx — CSP, HSTS, X-Content-Type-Options, Referrer-Policy.
            - Branded 404/error page.
            - Privacy-friendly analytics (Plausible or GA4-with-consent) that tracks CTA clicks.

          ISOLATE TESTING: extend the end2end-ui specs to assert, against the PR preview: the
          pipeline diagram is present as inline SVG showing three escalating gate tiers + an
          explicit human GitOps prod-promotion, with accessible text; no internal/preview
          hostnames appear anywhere in the rendered markup; the security headers are present;
          the branded 404 renders. Runnable against the preview; no new infrastructure.

          REPORT in the PR description: the diagram approach, exactly what you sanitised, and the
          a11y/perf/security results (contrast values, CWV, header scan).

          Done = PR merged (open via open_pr, drive gates green, seo-preview included).
