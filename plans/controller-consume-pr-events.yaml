# Stop discovering PR merges by polling GitHub every 15 seconds, when Lighthouse
# Keeper — our own fork — is the component performing the merge.
#
# TODAY (verified 2026-08-15)
# PlanReconciler returns RequeueAfter: 15s and, on every reconcile of a step at
# StepPhaseAwaitingReview, calls the pr_context MCP's get_pr_metadata, which calls
# GitHub. A PR sitting in review for two days is roughly 11,500 GitHub calls for ONE
# step, on a shared credential, to learn something our own Keeper already knows the
# instant it happens. That is reconciling the same fact in two places.
#
# WHY AN EXTERNAL PLUGIN, NOT A FORK PATCH
# mikelear/lighthouse already carries eight of our own merged PRs and is periodically
# merged with upstream. Wiring a Maestro dependency into pkg/keeper would be a much
# heavier patch to carry than the bug fixes and context-prefixing we carry today.
# Lighthouse ships pkg/externalplugincfg — a supported extension point where an
# in-cluster Service receives webhook events, registered by name (the config's own
# test fixtures show cd-indicators and lighthouse-webui-plugin using it). An external
# plugin is additive and survives upstream merges.
#
# THE PRINCIPLE THIS PLAN PRESERVES
# In a reconciler, an event TRIGGERS reconciliation — it never carries state. The
# handler must not write the PR outcome onto the step from the event body. It wakes
# the reconcile; the reconcile re-reads truth through the existing PROutcomeFetcher.
# Maestro is at-least-once and a permanently-failed delivery must cost latency, never
# a step wedged at AwaitingReview forever.
#
# SCOPE — CONSUMER SIDE ONLY, AND THE POLL IS LEFT ALONE
# This Plan builds only the controller's half. It deliberately does NOT change
# RequeueAfter. Dropping 15s to ~5 minutes is only safe once a real producer is live
# and proven; doing both at once would slow PR detection with nothing compensating for
# it. The requeue change is a separate, later Plan gated on evidence that events
# actually arrive.
#
# PREREQUISITE, NOT DELIVERED HERE
# The Lighthouse external plugin that announces pr.merged / pr.closed_unmerged to
# Maestro does not exist yet and needs a new repo, which no Plan step can create
# today. It is a needs-human prerequisite. This Plan is still worth landing first: it
# is inert until a producer exists, and it fixes the contract the producer must build
# to.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: controller-consume-pr-events
spec:
  paused: true
  steps:
    - name: pr-event-consumer
      kind: pr
      agentType: leartech-agent-go
      inputs:
        name: pr-event-consumer
        repo: mikelear/leartech-orchestrator-controller
        branch: feat/consume-pr-lifecycle-events
        goal: >-
          Let a Maestro PR-lifecycle event WAKE the Plan reconciler, so a merged PR is
          noticed immediately instead of on the next 15-second poll. The event is a
          trigger, never a fact.

          FOLLOW THE EXISTING PATTERN EXACTLY. internal/controller/ba_event_adapter.go
          plus ba_event_consumer_server.go already implement a Maestro consumer in this
          repo: a handler registered on a maestro.Registry, served by
          MaestroConsumerServer on :8082 at POST /consume_event, added via mgr.Add(), and
          non-leader-elected because duplicate deliveries are made harmless by
          deterministic naming. Register the new handlers on the SAME registry — the
          server's own comment says adding a second event kind means registering another
          handler and that the server does not care. Do not stand up a second server or a
          second port.

          THE TWO EVENTS: pr.merged and pr.closed_unmerged. They map 1:1 onto the
          PROutcomeMerged and PROutcomeClosedUnmerged values already defined in seams.go.
          Do not invent events for anything else — the step state machine cannot
          distinguish more than "open", "merged" and "closed unmerged", so a broader
          GitHub firehose would be noise. Expect annotations carrying at least the repo
          and the PR number; define the annotationKeys you require and document them,
          because Maestro rejects announcements whose annotations do not match what the
          consumer registered.

          THE HANDLER MUST NOT WRITE THE OUTCOME. Resolve which Plan (and step) owns that
          repo+PR, then trigger a reconcile of that Plan — an event-channel source or an
          equivalent enqueue. The reconcile then goes through the EXISTING
          PROutcomeFetcher / pr_context_mcp.go path and re-reads the truth from GitHub.
          Changing PROutcomeFetcher, pr_context_mcp.go or the _OUTCOME_TRANSITIONS table
          is out of scope for this change; if you find yourself editing them, stop and
          explain why in the PR description.

          DO NOT CHANGE RequeueAfter. It stays at 15 seconds in this PR. The poll is the
          self-healing backstop and it must keep working unchanged until a producer is
          live and proven. Lowering it is a separate, later change.

          UNKNOWN PR IS NOT AN ERROR. An event for a repo+PR this cluster has no Plan for
          is normal — both clusters see the same GitHub webhooks. Log it at debug and
          return success so Maestro settles the event; do not 5xx, or you will generate
          retries and a level-1 alert for every unrelated PR in the org.

          CHART: add the two events to the consumes: stanza of
          charts/leartech-orchestrator-controller/templates/maestro-eventregistration.yaml,
          alongside the existing plan.step.escalate entry. The baseURL is already the
          consumer port; confirm rather than assume, and leave the produces: list
          untouched in this PR.

          ISOLATE TESTING: unit tests with the controller-runtime fake client, mirroring
          ba_event_adapter_test.go. Assert that a pr.merged event for a known repo+PR
          enqueues a reconcile of the right Plan; that an event for an unknown PR is a
          logged no-op returning success; that a malformed or annotation-missing event
          does not panic; and that the handler never mutates step status directly. Add a
          chart-render test asserting both events appear in the consumes: stanza, in the
          style of the existing chart_*_test.go files. No cluster required.

          LOGGING TO VERIFY: emit a loop_hop line on receipt, following the contract in
          loop_logging.go and the snake_case event_id convention its comments describe, so
          a PR merge can be traced webhook -> Maestro -> reconcile in Loki. Read that file
          before choosing key names — it is explicit about not mixing camelCase and
          snake_case spellings of the same correlation id in one record.

          Done = PR merged (open via open_pr, drive gates green).
