# Bootstrap leartech-fxdemo-rates — the go back end of the fxdemo Project.
#
# Graduated from leartech-project-fxdemo: domain "rates", persistence "postgres".
# Rationale: fetch + cache GBP/USD (Frankfurter, mock until live)
#
# Bootstrap only: create from the golden template, register both clusters,
# scaffold, drive ONE green PR. verify-release-flow is auto-injected (R23).
# The service FEATURE is a separate judged Plan against the repo this creates.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fxdemo-fxdemo-rates-bootstrap
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-fxdemo-rates
        templateRepo: leartech-go-service-template
        language: go
        namespace: jx-staging
