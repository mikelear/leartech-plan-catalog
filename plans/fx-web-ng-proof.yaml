# fx-web-ng-proof — prove the Angular dev agent through the REAL bootstrap path.
#
# language: angular, so the controller derives agentType leartech-agent-ng for the
# dev step + `make -f /usr/local/share/leartech-ng.mk ci`. Bootstraps a real
# Angular service from the now-golden leartech-angular-service-template. This is
# the end-to-end validation of: agent-ng image (baked ng.mk) + language-aware
# template + the golden Angular template (clones green) + the Envoy HTTPRoute.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fx-web-ng-proof
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-fx-web-ng
        templateRepo: leartech-angular-service-template
        language: angular
        namespace: jx-staging
