# fx-rate-go-proof — prove the Go dev agent through the REAL bootstrap path,
# the language:go counterpart of fx-web-ng-proof. language omitted/go so the
# controller derives agentType leartech-agent-go + the baked go.mk CI. Bootstraps
# a real Go service from leartech-go-service-template. Validates the SAME neutral
# agent standard works for Go after all the language-aware + crashloop fixes.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fx-rate-go-proof
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-fx-rate-go
        templateRepo: leartech-go-service-template
        language: go
        namespace: jx-staging
