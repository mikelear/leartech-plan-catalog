# Plan-only end-to-end proof: a Go backend service stood up entirely by the
# bootstrap-authed-service template — create -> register(gcp,az) -> scaffold ->
# dev(one PR) — with the register steps opting in to pr-stuck BA escalation
# (inherited from the template) and the Go dev agent now licensed to push when a
# local check is unfixable-in-pod (CI is the authority). This is exactly what the
# Project workflow emits; hand-authored here to prove the Plan path hands-off.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fx-rate-go-proof
spec:
  paused: true # created paused; Gate 3 (unpause) is the human start
  steps:
    - name: bootstrap
      use: bootstrap-authed-service
      with:
        name: leartech-fx-rate-go
        templateRepo: mikelear/leartech-plan-api
        namespace: jx-staging
        language: go
