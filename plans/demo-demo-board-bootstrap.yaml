# Bootstrap leartech-demo-board — the angular front end of the demo Project.
#
# Graduated from leartech-project-demo: domain "overview", persistence "none".
# Rationale: the live GBP/USD ticker
# Design: sealed artefact 5e756992-9dfb-4189-8ca9-8e5b3af6f178 (Project design/demo-board.md) — the follow-up feature
# Plan builds the UI to this; Decision-5 hold is cleared.
#
# Bootstrap only: create from the golden template, register both clusters,
# scaffold, drive ONE green PR. verify-release-flow is auto-injected (R23).
# The service FEATURE is a separate judged Plan against the repo this creates.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: demo-demo-board-bootstrap
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-demo-board
        templateRepo: leartech-angular-service-template
        language: angular
        namespace: jx-staging
