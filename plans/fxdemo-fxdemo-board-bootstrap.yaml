# Bootstrap leartech-fxdemo-board — the angular front end of the fxdemo Project.
#
# Graduated from leartech-project-fxdemo: domain "overview", persistence "none".
# Rationale: the live GBP/USD ticker the operator watches
# Design: sealed artefact 5a90544a-36f5-4df9-9f3d-fddf2cd237c9 (Project design/fxdemo-board.md) — the follow-up feature
# Plan builds the UI to this; Decision-5 hold is cleared.
#
# Bootstrap only: create from the golden template, register both clusters,
# scaffold, drive ONE green PR. verify-release-flow is auto-injected (R23).
# The service FEATURE is a separate judged Plan against the repo this creates.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fxdemo-fxdemo-board-bootstrap
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-fxdemo-board
        templateRepo: leartech-angular-service-template
        language: angular
        namespace: jx-staging
