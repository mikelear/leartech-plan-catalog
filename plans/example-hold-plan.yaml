# Example catalog Plan — a HOLD-BY-DEFAULT proposal.
#
# Minimal, lint-passing reference showing the required shape:
#   - apiVersion / kind for the platform CRD
#   - a short DNS-1123 name (<=58 chars)
#   - spec.paused: true  <-- MANDATORY (merging does NOT run it)
#   - per-step `inputs` matching the agentType (R21): dev agents take an Initiative
#     {name, repo, goal}; the infra agent takes an {action, ...}.
#
# Copy this as a starting point; delete it from your real submission.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: example-hold-plan
spec:
  # Hold-by-default: this Plan is a proposal, not a running job.
  paused: true
  steps:
    - name: add-badge
      kind: pr
      agentType: leartech-agent-go
      inputs:                       # dev agent → Initiative shape
        name: add-badge
        repo: mikelear/leartech-go-service-template
        branch: feat/add-badge
        goal: >-
          Add a ShipProven "proven before it ships" badge to the top of README.md.
          Open a PR via open_pr. Done = PR merged and CI gates green.
    - name: verify-release
      kind: check
      agentType: leartech-agent-infra
      dependsOn:
        - add-badge
      inputs:                       # infra agent → action-driven
        action: release-health-check
        service: leartech-go-service-template
        namespace: jx-staging
        budgetMinutes: 30
