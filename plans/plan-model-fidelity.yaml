# Bring plan-api + the ShipProven Portal up to the current Plan model.
#
# WHY (always-needed follow-up to the kind/plan-type work):
#   - PlanStep gained `kind` (pr|apply|check) + a check `verdict`; steps support
#     use/with, fanIn, triggeredWhen. The controller CRD has all of this.
#   - leartech-plan-api's DTOs + OpenAPI LAG it (no kind, no verdict, no use/with) —
#     a Plan posted via plan-api loses `kind`. Also blocks the single-writer direction.
#   - the ShipProven Portal generates its client from plan-api's OpenAPI, so its plan
#     views can't surface the new fields until plan-api exposes them.
#
# DAG: plan-api DTO fidelity lands + is released before the Portal regenerates its
# client (merged != deployed → a release-health gate sits between them).
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: plan-model-fidelity
spec:
  paused: true
  steps:
    - name: plan-api-dto
      kind: pr
      agentType: leartech-agent-go
      inputs:
        name: plan-api-dto-fidelity
        repo: mikelear/leartech-plan-api
        goal: >-
          Bring plan-api's DTOs + OpenAPI up to the controller Plan CRD (the source of
          truth). CreatePlanStep (internal/dto/create.go): add `kind` (enum
          pr|apply|check; empty→pr) and pass-through `use` + `with` (plan-api stores
          them unexpanded; the controller expands). Keep spec.paused FORCED true. Read
          DTOs (internal/dto/plan.go): surface `kind`, status `verdict` (PASS|FAIL),
          use/with. Update mapper + validator (kind must be pr|apply|check). Regenerate
          api/openapi.yaml + swaggo docs. Tests: create kind=check round-trips; read
          surfaces kind+verdict; bad kind rejected. Done = PR merged, gates green.
    - name: plan-api-live
      kind: check
      agentType: leartech-agent-infra
      dependsOn:
        - plan-api-dto
      inputs:
        action: release-health-check
        service: leartech-plan-api
        namespace: jx-staging
        budgetMinutes: 30
    - name: portal-client
      kind: pr
      agentType: leartech-agent-ng
      dependsOn:
        - plan-api-live
      inputs:
        name: portal-plan-client
        repo: mikelear/leartech-ship-proven-portal
        goal: >-
          Regenerate the Portal's plan-api client from the now-updated OpenAPI so the
          generated DTOs re-exported in src/app/plan/plan.models.ts (Plan=DtoPlan,
          Step=DtoStep) gain `kind`, status `verdict`, and `use`/`with` (paused/hold/
          fanIn/dependsOn already present). Refresh plan-api URL/audience only if not
          wired. Typed model only — no UI rendering yet. Update plan-mock.fixture +
          specs to the new shape. Done = PR merged, gates green.
    - name: portal-views
      kind: pr
      agentType: leartech-agent-ng
      dependsOn:
        - portal-client
      inputs:
        name: portal-plan-views
        repo: mikelear/leartech-ship-proven-portal
        goal: >-
          Update the EXISTING plan surface (plans-list, plan-detail, create-plan, DAG)
          to render the new model: a `kind` badge per step; for a kind:check step its
          `verdict` as a PASS/FAIL pill; the use/with template ref in detail; colour DAG
          nodes by kind/verdict; let create-plan set kind + pick a template via use/with.
          Update end2end-ui (real-auth) specs for the kind badge + verdict pill.
          Done = PR merged, gates green.
    - name: verify-portal
      kind: check
      agentType: leartech-agent-infra
      dependsOn:
        - portal-views
      inputs:
        action: release-health-check
        service: leartech-ship-proven-portal
        namespace: jx-staging
        budgetMinutes: 30
