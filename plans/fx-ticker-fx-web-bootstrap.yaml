# Bootstrap leartech-fx-web — the angular front end of the fx-ticker Project.
#
# Graduated from leartech-project-fx-ticker: domain "ui", persistence "none".
# Rationale: the ticker a browser loads
# Design: sealed artefact 6d5a1f6b-cbd6-4b41-9fd0-9033479f80f7 (Project design/fx-web.md) — the follow-up feature
# Plan builds the UI to this; Decision-5 hold is cleared.
#
# Bootstrap only: create from the golden template, register both clusters,
# scaffold, drive ONE green PR. verify-release-flow is auto-injected (R23).
# The service FEATURE is a separate judged Plan against the repo this creates.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fx-ticker-fx-web-bootstrap
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-fx-web
        templateRepo: leartech-angular-service-template
        namespace: jx-staging
