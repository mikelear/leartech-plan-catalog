# Implement the artifact-api storage endpoints + wire the design MCP tools to them.
#
# CONTEXT
# The service (leartech-artifact-api) and the design MCP server
# (leartech-mcp-servers/internal/designserver) are DEPLOYED but not yet implemented:
# artifact-api's only handlers are health + metrics, and designserver's create/list/get
# tools have no backing endpoints. Auth is already wired end-to-end (RFC 8693 token
# exchange live on both clusters; audience `leartech-artifact-api`; scopes
# leartechapi:artifact:read / :write).
#
# ARTIFACTS ARE GUIDANCE, NOT DELIVERABLES. An artifact is an input a Plan consumes;
# it is never published, never served to a browser. So: no public bucket path, no
# visibility flag, no publish scope. Signed URLs throughout.
#
# REVIEW FINDING BAKED IN AS STEP 1
# leartech-artifact-api has NO gitops overlay, so it runs on chart defaults with
# AUTH_ENABLED=true but LEARTECH_AUTH_SERVER_URL="" — no issuer, no JWKS. Harmless
# today (only health + metrics exist) but it breaks the moment authenticated endpoints
# land. Same failure mode as leartech-orchestrator-web-ui. Fixed first, deliberately.
#
# Maintainer note: if you would rather apply the two gitops steps by hand, drop
# `gitops-gsm` / `gitops-akv` and add their config before promoting this Plan.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: artifact-endpoints
spec:
  paused: true
  description: >-
    Implement leartech-artifact-api's artifact storage endpoints over Google Cloud
    Storage (official Go SDK), enforce the leartechapi:artifact scopes, and wire the
    already-deployed design MCP tools to them. Ends with a real cross-session
    round-trip: publish an artifact, retrieve it by label.
  steps:
    # ── 1. Prerequisite: the missing gitops overlay (auth issuer + bucket) ──
    - name: gitops-gsm
      kind: pr
      agentType: leartech-agent-go
      repo: mikelear/jx-build-cluster-gsm
      goal: >-
        Add helmfiles/jx-staging/configs/leartech-artifact-api.yaml. leartech-artifact-api
        currently deploys on chart defaults, so AUTH_ENABLED=true but
        LEARTECH_AUTH_SERVER_URL is empty — auth cannot validate because there is no
        issuer for JWKS. Set auth.serverUrl to the GCP staging Hydra
        (https://hydra-jx-staging.jx.leartech.com) and auth.audience to
        leartech-artifact-api (bare-name convention, matching leartech-plan-api).
        Leave cors.allowedOrigins as an EMPTY list — safe-closed; the service has no
        browser callers, only the MCP over ClusterIP. Do NOT add an ingress. Also set
        the GCS bucket + project values the storage adapter reads (see the sibling
        gcs-storage step for the exact value names; co-ordinate naming with it).
        Mirror the structure and comment style of
        helmfiles/jx-staging/configs/leartech-plan-api.yaml.
        Done = PR opened via open_pr and gates green.

    - name: gitops-akv
      kind: pr
      agentType: leartech-agent-go
      repo: mikelear/jx-build-cluster-akv
      goal: >-
        Mirror the gitops-gsm change for the Azure cluster. Identical shape, but the
        per-cluster Hydra issuer is https://hydra-jx-staging.az.leartech.com. Confirm
        parity with the gsm file field-for-field — the two clusters must not drift.
        Note Helm list values REPLACE rather than merge, so any list override must
        repeat the chart defaults verbatim.
        Done = PR opened via open_pr and gates green.

    # ── 2. Storage adapter — the first real Go/GCS work ──
    - name: gcs-storage
      kind: pr
      agentType: leartech-agent-go
      repo: mikelear/leartech-artifact-api
      goal: >-
        Add an internal/storage package implementing the artifact object layout on
        Google Cloud Storage using the official Go SDK (cloud.google.com/go/storage),
        authenticating via Workload Identity — no service-account JSON keys.

        LAYOUT (revisions are IMMUTABLE):
          artifact/<guid>/<revision>/manifest.json
          artifact/<guid>/<revision>/<files...>
          artifact/<guid>/latest              (mutable pointer only)

        MANIFEST fields: id (GUID), label, kind, target (optional), ttl, revision,
        producer (PER REVISION, not per artifact), publishedBy {client, subject},
        files [{path, bytes, sha256}].

        REQUIRED BEHAVIOUR:
        - Allocate a GUID per artifact; `label` is the human-facing discovery key.
        - Writes create a NEW revision and MUST NEVER overwrite an existing one. If a
          Plan consumed revision 3, the record of what it consumed has to survive —
          overwriting destroys the audit trail. Reject writes to an existing revision.
        - Mint V4 signed URLs for upload (PUT) and download (GET). Bytes go direct to
          GCS and never through the service.
        - No public-readable path: artifacts are guidance consumed by Plans, never
          published. Signed URLs only.
        - No database. The manifest IS the record; keep database.enabled false.

        ISOLATE TESTING: unit tests against a fake/in-memory storage seam (interface +
        test double), covering GUID allocation, revision immutability (second write to
        the same revision is refused), manifest round-trip, and signed-URL generation.
        Runnable with `go test ./...` and NO real GCS bucket.

        LOGGING TO VERIFY: structured logs per operation (op, artifact id, revision,
        label, request id, outcome) queryable in Loki.

        Also remove the scaffold-inherited plan-api internals that artifacts do not
        need (internal/plans, internal/orcv1alpha1, internal/gates, internal/k8s) if
        nothing references them, so the repo stops implying CRD behaviour it has none of.
        Done = PR opened via open_pr and gates green.

    # ── 3. The endpoints + scope enforcement ──
    - name: rest-endpoints
      kind: pr
      agentType: leartech-agent-go
      repo: mikelear/leartech-artifact-api
      dependsOn:
        - gcs-storage
      goal: >-
        Add the artifact REST endpoints on /api/v1, backed by internal/storage, and
        enforce scopes AT THE SERVICE.

        ENDPOINTS:
          POST   /api/v1/artifacts                 -> {id, revision, uploadURL, expiresAt}
          POST   /api/v1/artifacts/{id}/revisions  -> new revision on an existing artifact
          POST   /api/v1/artifacts/{id}/finalize   -> validate + seal, returns manifest
          GET    /api/v1/artifacts                 -> list; filter by kind, label, target
          GET    /api/v1/artifacts/{id}            -> manifest + signed download URLs
                                                      (accept a label as well as a GUID)

        AUTHZ — the load-bearing rule: enforce the caller's own audience and scope on
        EVERY request, regardless of caller. Never assume "the MCP already checked".
        leartechapi:artifact:read gates the GETs; leartechapi:artifact:write gates the
        POSTs. Derive tenant from the validated token claims and filter on it, so
        artifacts are isolated per tenant. There is deliberately NO publish scope.

        FINALIZE validates thinly and no more: manifest parses, every declared file
        exists in the object store, sizes are sane. Kind-specific validation is
        explicitly out of scope.

        Keep api/openapi.yaml and the swaggo annotations in step so /openapi.json and
        /docs stay accurate, and the generated clients pick the endpoints up on release.

        ISOLATE TESTING: handler unit tests with a fake storage seam and a fake token
        context, covering: 401 unauthenticated, 403 wrong scope, 403 wrong audience,
        404 unknown id/label, 409 write to an existing revision, and the happy paths.
        No real GCS, no real Hydra.

        LOGGING TO VERIFY: structured logs (route, artifact id, revision, scope
        decision, tenant, request id, outcome) queryable in Loki.
        Done = PR opened via open_pr and gates green.

    # ── 4. Wire the already-deployed MCP tools ──
    - name: mcp-tools
      kind: pr
      agentType: leartech-agent-go
      repo: mikelear/leartech-mcp-servers
      dependsOn:
        - rest-endpoints
      goal: >-
        Wire internal/designserver's tools to the new artifact-api endpoints. The
        client, auth and audience plumbing already exist — do not reinvent them; the
        three-tier outbound behaviour (forward the caller's Bearer verbatim, RFC 8693
        exchange when the audience differs, s2s only when there is no caller Bearer)
        must be preserved exactly as internal/planserver implements it, including the
        principle that the MCP NEVER widens authority beyond the caller's own.

        Existing tools to back: list_artifacts, get_artifact, create_artifact.
        Add finalize_artifact so a producer can seal a revision, since upload is a
        separate presigned PUT the MCP never proxies.

        create_artifact must return the presigned uploadURL to the caller — bytes go
        direct to GCS over PUT and MUST NOT be proxied through MCP or the service.

        Also register this server in the agent MCP catalog
        (leartech-automated-agent gate/agent/mcp_catalog.yaml is a SEPARATE repo — do
        not edit it here; note it in the PR description as a follow-up) so Plans can
        fetch artifacts referenced in a step goal.

        ISOLATE TESTING: table tests using the existing fakes_test.go seam, asserting
        each tool maps to the right endpoint and that the forward/exchange/s2s tier
        selection is unchanged. Extend tokenexchange_test.go coverage to the artifact
        path. No real cluster, no real Hydra.

        LOGGING TO VERIFY: structured logs per tool call (tool, artifact id, tier used,
        request id, outcome) queryable in Loki.
        Done = PR opened via open_pr and gates green.

    # ── 5. The acceptance test that matters ──
    - name: verify-roundtrip
      kind: check
      agentType: leartech-agent-infra
      dependsOn:
        - gitops-gsm
        - gitops-akv
        - mcp-tools
      goal: >-
        Deterministically confirm the artifact path works end to end on jx-staging,
        on BOTH clusters.

        Done when all of the following hold:
        - leartech-artifact-api pods are Ready and /openapi.json returns 200 probed
          from INSIDE the namespace (the service has no ingress by design).
        - An unauthenticated request to /api/v1/artifacts returns 401, and a token
          carrying the wrong audience is rejected.
        - Via the design MCP: create_artifact returns a GUID plus a presigned upload
          URL; a PUT of a small tokens.json to that URL succeeds; finalize_artifact
          returns a manifest listing the file with a matching sha256.
        - get_artifact resolves the same artifact BY LABEL and returns a working
          signed download URL whose bytes match what was uploaded.
        - A second write to the same revision is refused (immutability holds).
        - Structured logs for the above appear in Loki with the request ids.

        Report per-assertion pass/fail; do not open a PR.
