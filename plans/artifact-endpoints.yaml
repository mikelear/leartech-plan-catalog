# Implement the artifact-api storage endpoints + wire the design MCP tools to them.
#
# CONTEXT
# The service (leartech-artifact-api) and the design MCP server
# (leartech-mcp-servers/internal/designserver) are DEPLOYED but not yet implemented:
# artifact-api's only handlers are health + metrics, and designserver's create/list/get
# tools have no backing endpoints. Auth is already wired end-to-end (RFC 8693 token
# exchange live on both clusters; audience `leartech-artifact-api`; scopes
# leartechapi:artifact:read / :write).
#
# ARTIFACTS ARE GUIDANCE, NOT DELIVERABLES. An artifact is an input a Plan consumes;
# it is never published, never served to a browser. So: no public bucket path, no
# visibility flag, no publish scope. Signed URLs throughout.
#
# PRECONDITION — APPLIED BY HAND, NOT BY THIS PLAN
# This Plan writes CODE ONLY. The platform config and cloud identity it depends on are
# applied in-session before the Plan is promoted, and are deliberately NOT steps here:
# they include a `terraform import` of gs://artifacts-product-first, a bucket that was
# created by hand and ALREADY HOLDS a design bundle. If an agent wrote that terraform
# and the plan came out as replace-instead-of-import, the bundle would be destroyed —
# silently, and no gate would catch it. That risks real data for no gain, so a human
# reads the `terraform plan` instead.
#
# What must already be true when this Plan starts:
#   - a DEDICATED artifact-api GSA exists (NOT test-artifacts-writer, whose terraform
#     purpose is world-readable Playwright artifacts)
#   - it holds roles/storage.objectAdmin on the artifact bucket only
#   - it holds roles/iam.serviceAccountTokenCreator ON ITSELF, so it can signBlob
#   - the leartech-artifact-api KSA is Workload-Identity-bound to it on GCP; on AKV
#     (where cross-cloud WI is impossible) a JSON key is ESO-synced and mounted at
#     GOOGLE_APPLICATION_CREDENTIALS
#   - the gitops overlay sets the Hydra issuer + audience. Without the issuer,
#     AUTH_ENABLED=true but LEARTECH_AUTH_SERVER_URL="" means no JWKS and auth cannot
#     validate — harmless while only health + metrics exist, broken the moment
#     authenticated endpoints land. Same failure mode as leartech-orchestrator-web-ui.
#
# If the config is missing when this Plan runs, gcs-storage's startup fail-fast trips
# and the auto-injected release verification goes red. That is the intended failure —
# loud, not subtle. Do NOT "fix" it by having a step write the config.
#
# CONFIG CONTRACT (pinned, not negotiated at runtime)
# The steps cannot agree on names while running, and the config is applied by hand
# outside this Plan, so the contract is fixed here:
#   ARTIFACT_GCS_BUCKET   — the artifact bucket
#   ARTIFACT_GCS_PROJECT  — the GCP project
#   ARTIFACT_SIGNER_SA    — the signing identity's email, for signBlob
# Read these exact names. Do not invent alternatives and do not derive the signer
# email by parsing a key file.
#
# MERGED != DEPLOYED
# A kind:pr step completes at MERGE, but release -> GitOps -> rollout takes minutes.
# verify-roundtrip therefore polls until the released version is live rather than
# asserting at merge time, so it cannot race the rollout.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: artifact-endpoints
spec:
  paused: true
  steps:
    # ── 2. Storage adapter — the first real Go/GCS work ──
    - name: gcs-storage
      kind: pr
      agentType: leartech-agent-go
      inputs:
        name: gcs-storage
        repo: mikelear/leartech-artifact-api
        branch: feat/gcs-storage
        goal: >-
          Add an internal/storage package implementing the artifact object layout on
          Google Cloud Storage using the official Go SDK (cloud.google.com/go/storage),
          authenticating via Application Default Credentials.

          SIGNING (a verified constraint — do NOT assume plain Workload Identity is
          enough). A WI-federated token can read and write objects but CANNOT mint V4
          signed URLs: signing needs either a private key or the IAM signBlob API. This
          was proved with a debug pod on the live cluster — WI reads succeeded and
          `sign-url` failed. So implement signing as:
            - Read the signing identity's email from ARTIFACT_SIGNER_SA (set by the gitops
              steps). Do NOT parse a key file to discover it.
            - Call storage.SignedURL with GoogleAccessID set to that email and SignBytes
              delegating to the IAM Credentials signBlob API, which is what the
              roles/iam.serviceAccountTokenCreator self-binding on the GSA enables (already
              applied — see PRECONDITION in the header).
            - When a JSON key IS present at GOOGLE_APPLICATION_CREDENTIALS — the Azure
              path, where cross-cloud WI is impossible — the SDK can sign locally with the
              private key and no signBlob call is needed.
          Support BOTH routes and choose automatically: sign locally when the resolved
          credential carries a private key, else fall back to signBlob. Fail fast at
          startup when NEITHER route is available, rather than discovering it on the first
          presigned URL.

          CONFIG CONTRACT (fixed — the gitops overlay ALREADY sets these exact env vars,
          applied by hand before this Plan was promoted; read them by these exact names
          and do NOT add a step to write them): ARTIFACT_GCS_BUCKET,
          ARTIFACT_GCS_PROJECT and ARTIFACT_SIGNER_SA. Fail fast at startup with a clear
          message if any is empty, rather than failing later on the first upload — that
          fail-fast IS the guard that the precondition was applied.

          LAYOUT (revisions are IMMUTABLE):
            artifact/<guid>/<revision>/manifest.json
            artifact/<guid>/<revision>/<files...>
            artifact/<guid>/latest              (mutable pointer only)

          MANIFEST fields: id (GUID), label, kind, target (optional), ttl, revision,
          producer (PER REVISION, not per artifact), publishedBy {client, subject},
          files [{path, bytes, sha256}].

          REQUIRED BEHAVIOUR:
          - Allocate a GUID per artifact; `label` is the human-facing discovery key.
          - Writes create a NEW revision and MUST NEVER overwrite an existing one. If a
            Plan consumed revision 3, the record of what it consumed has to survive —
            overwriting destroys the audit trail. Reject writes to a finalized revision.
          - Mint V4 signed URLs for upload (PUT) and download (GET). Bytes go direct to
            GCS and never through the service.
          - No public-readable path: artifacts are guidance consumed by Plans, never
            published. Signed URLs only.
          - No database. The manifest IS the record; keep database.enabled false.

          ISOLATE TESTING: unit tests against a fake/in-memory storage seam (interface +
          test double), covering GUID allocation, revision immutability (a write to a
          finalized revision is refused), multi-revision creation, manifest round-trip,
          and signed-URL generation. Runnable with `go test ./...` and NO real GCS bucket.

          LOGGING TO VERIFY: structured logs per operation (op, artifact id, revision,
          label, request id, outcome) queryable in Loki.

          Also remove the scaffold-inherited plan-api internals that artifacts do not
          need (internal/plans, internal/orcv1alpha1, internal/gates, internal/k8s) if
          nothing references them, so the repo stops implying CRD behaviour it has none of.
          Done = PR merged (open via open_pr, drive gates green).

    # ── 3. The endpoints + scope enforcement ──
    - name: rest-endpoints
      kind: pr
      agentType: leartech-agent-go
      dependsOn:
        - gcs-storage
      inputs:
        name: rest-endpoints
        repo: mikelear/leartech-artifact-api
        branch: feat/rest-endpoints
        goal: >-
          Add the artifact REST endpoints on /api/v1, backed by internal/storage, and
          enforce scopes AT THE SERVICE.

          ENDPOINTS:
            POST   /api/v1/artifacts                 -> {id, revision, uploadURL, expiresAt}
            POST   /api/v1/artifacts/{id}/revisions  -> new revision on an existing artifact
            POST   /api/v1/artifacts/{id}/finalize   -> validate + seal, returns manifest
            GET    /api/v1/artifacts                 -> list; filter by kind, label, target
            GET    /api/v1/artifacts/{id}            -> manifest + signed download URLs
                                                        (accept a label as well as a GUID)

          AUTHZ — the load-bearing rule: enforce the caller's own audience and scope on
          EVERY request, regardless of caller. Never assume "the MCP already checked".
          leartechapi:artifact:read gates the GETs; leartechapi:artifact:write gates the
          POSTs. Derive tenant from the validated token claims and filter on it, so
          artifacts are isolated per tenant. There is deliberately NO publish scope.

          FINALIZE validates thinly and no more: manifest parses, every declared file
          exists in the object store, sizes are sane. Kind-specific validation is
          explicitly out of scope. A write to an ALREADY-FINALIZED revision returns 409.

          Keep api/openapi.yaml and the swaggo annotations in step so /openapi.json and
          /docs stay accurate, and the generated clients pick the endpoints up on release.

          ISOLATE TESTING: handler unit tests with a fake storage seam and a fake token
          context, covering: 401 unauthenticated, 403 wrong scope, 403 wrong audience,
          404 unknown id/label, 409 write to a finalized revision, second-revision
          creation via POST /{id}/revisions, and the happy paths. No real GCS, no real
          Hydra.

          LOGGING TO VERIFY: structured logs (route, artifact id, revision, scope
          decision, tenant, request id, outcome) queryable in Loki.
          Done = PR merged (open via open_pr, drive gates green).

    # ── 4. Wire the already-deployed MCP tools ──
    - name: mcp-tools
      kind: pr
      agentType: leartech-agent-go
      dependsOn:
        - rest-endpoints
      inputs:
        name: mcp-tools
        repo: mikelear/leartech-mcp-servers
        branch: feat/mcp-tools
        goal: >-
          Wire internal/designserver's tools to the new artifact-api endpoints. The
          client, auth and audience plumbing already exist — do not reinvent them; the
          three-tier outbound behaviour (forward the caller's Bearer verbatim, RFC 8693
          exchange when the audience differs, s2s only when there is no caller Bearer)
          must be preserved exactly as internal/planserver implements it, including the
          principle that the MCP NEVER widens authority beyond the caller's own.

          Existing tools to back: list_artifacts, get_artifact, create_artifact.
          Add finalize_artifact so a producer can seal a revision, since upload is a
          separate presigned PUT the MCP never proxies. Expose revision creation too, so
          a second revision can be added to an existing artifact.

          create_artifact must return the presigned uploadURL to the caller — bytes go
          direct to GCS over PUT and MUST NOT be proxied through MCP or the service.

          Also register this server in the agent MCP catalog
          (leartech-automated-agent gate/agent/mcp_catalog.yaml is a SEPARATE repo — do
          not edit it here; note it in the PR description as a follow-up) so Plans can
          fetch artifacts referenced in a step goal.

          ISOLATE TESTING: table tests using the existing fakes_test.go seam, asserting
          each tool maps to the right endpoint and that the forward/exchange/s2s tier
          selection is unchanged. Extend tokenexchange_test.go coverage to the artifact
          path. No real cluster, no real Hydra.

          LOGGING TO VERIFY: structured logs per tool call (tool, artifact id, tier used,
          request id, outcome) queryable in Loki.
          Done = PR merged (open via open_pr, drive gates green).

    # ── 4. Rollout gate — merged is NOT deployed ──
    # Waits for the released version to be live rather than assuming a merge means a
    # rollout. It does NOT depend on the platform config, because that is applied by
    # hand BEFORE this Plan is promoted (see PRECONDITION in the header).
    - name: verify-roundtrip
      kind: check
      agentType: leartech-agent-go
      dependsOn:
        - rest-endpoints
        - mcp-tools
      inputs:
        name: verify-roundtrip
        repo: mikelear/leartech-artifact-api
        branch: feat/verify-roundtrip
        goal: >-
          Because release verification is AUTO-INJECTED after the PR step (R23) rather than hand-authored, this step depends on the PR step directly and MUST therefore wait for the rollout itself: poll until the released version is live on the target cluster(s) with a deadline, and FAIL (exit non-zero) if it is not. Verifying at merge time races the rollout and asserts against the old version. 
          Deterministically confirm the artifact path works end to end on jx-staging, on
          BOTH clusters. This is a verification step only — do NOT open a PR and do NOT
          modify the repo. FAIL (exit non-zero) if ANY assertion below fails; the verdict
          is this step's exit code, so reporting a failure while exiting 0 would wrongly
          pass the Plan.

          Assertions:
          - leartech-artifact-api /openapi.json returns 200 probed from INSIDE the
            namespace (the service has no ingress by design).
          - An unauthenticated request to /api/v1/artifacts returns 401, and a token
            carrying the wrong audience is rejected.
          - Via the design MCP: create_artifact returns a GUID plus a presigned upload
            URL; a PUT of a small tokens.json to that URL succeeds; finalize_artifact
            returns a manifest listing the file with a matching sha256.
          - get_artifact resolves the same artifact BY LABEL and returns a working signed
            download URL whose bytes match what was uploaded.
          - A second revision is created via POST /api/v1/artifacts/{id}/revisions,
            uploaded and finalized; get_artifact can still retrieve revision 1 unchanged,
            proving revisions are additive not destructive.
          - A write to an already-finalized revision returns 409, so immutability holds on
            the revision path and not only on the initial revision.
          - Structured logs for the above appear in Loki with the request ids.
