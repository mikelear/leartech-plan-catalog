# Bootstrap the fx-rate-api service — the Go back end of the fx-ticker Project.
#
# This is the deterministic half: create the repo from the golden Go service
# template, register it in both build clusters' source-config, scaffold it onto
# main, and drive ONE adapting PR green on both clusters. The verify-release-flow
# checks are AUTO-INJECTED after the PR step (R23) — the Plan does not hand-author
# them.
#
# The fx-rate-api FEATURE (serve GBP/USD from open.er-api.com with a frankfurter
# fallback, cache history in Postgres) is a SEPARATE judged Plan against the repo
# this one creates — the same two-Plan split as blockchain-service-bootstrap ->
# blockchain-service-endpoints. Bootstrap is infra; the feature is dev work.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fx-ticker-rate-api-bootstrap
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-fx-rate-api
        templateRepo: leartech-go-service-template
        namespace: jx-staging
