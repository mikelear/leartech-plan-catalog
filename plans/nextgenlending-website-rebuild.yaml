# Rebuild the public www.nextgenlending.co.uk as a standard, AI-discoverable SSG
# Angular site — content described inline (no artifact bundle).
#
# WHY THIS PLAN EXISTS
# NextGen Lending is a new lender running its OWN public, EVM-compatible blockchain
# that behaves like a core-banking platform on-chain. The current repo is a Webpack
# Module-Federation *shell* (ngx-build-plus + @angular-architects/module-federation)
# whose old toolchain carries ~13 breaking-fix npm-audit advisories and has no ESLint
# — it can't pass the golden gates. This Plan RE-SCAFFOLDS it to the standard golden
# @angular/build template (same as leartech-mortgagesourcing-web / ship-proven),
# DROPPING Module Federation, and rebuilds the content. The re-scaffold is what clears
# npm-audit + wires ng lint + playwright e2e, so the golden gates (already on main via
# the .lighthouse upgrade) go green.
#
# DESIGN SOURCE — inline (no GCS bundle). The brand + content direction is described in
# the goal. A separate BLOCKCHAIN session will review this PR and confirm/fill the
# chain-specific values flagged "[confirm: blockchain session]" (RPC endpoint + CORS,
# chain id, native token, block time, headline stats). Build gracefully around those so
# the site is correct + deployable before they are pinned.
#
# VERIFICATION — auto-injected, deliberately NOT hand-authored.
# R23 auto-composes verify-release-flow after every deployable PR step, wired to the real
# merged PR; hand-authoring it would duplicate that (and R24 rules out the sha: HEAD such a
# step needs). So this is a single PR step; release/deploy verification arrives on submission.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: nextgenlending-website-rebuild
spec:
  paused: true
  steps:
    - name: rebuild-public-site
      kind: pr
      agentType: leartech-agent-ng
      inputs:
        name: rebuild-public-site
        repo: mikelear/next-generation-lending-website
        branch: feat/nextgen-public-site
        goal: >-
          Rebuild the public www.nextgenlending.co.uk as a standard, AI-discoverable,
          server-prerendered (SSG) Angular site. The content direction is in this goal;
          build to it. Some chain-specific values are marked "[confirm: blockchain session]" —
          build gracefully around them (runtime-config + explorer as source of truth) so the
          site is correct and deployable before they are pinned; do NOT invent chain facts.

          VERIFY CURRENT STATE FIRST. The repo is currently a Webpack Module-Federation SHELL
          (ngx-build-plus + @angular-architects/module-federation, loading MFEs at runtime).
          Inspect what exists (routes, build config, chart, Dockerfile, nginx) before changing.
          Report the starting state in the PR.

          RE-SCAFFOLD TO THE GOLDEN TEMPLATE. Convert this to a STANDARD golden @angular/build
          Angular app — the same shape as leartech-mortgagesourcing-web / the angular service
          template: @angular/build (esbuild) with outputMode: static (prerender), ng lint
          (angular-eslint), a test setup with coverage, and playwright end2end/end2end-ui.
          DROP Module Federation entirely (remove ngx-build-plus, @angular-architects/module-
          federation, the custom webpack configs, mfe.conf.json + the MFE loading utils). This
          re-scaffold is deliberate: it clears the old webpack toolchain's npm-audit advisories
          and wires the lint/test/e2e the golden gates need. PRESERVE the deployment plumbing:
          the Helm chart (keep fullnameOverride: ngl-website — DNS label length limit), the
          nginx static-serve Dockerfile, the domain nextgenlending.co.uk, and the existing
          ingress/cert wiring. The site must build to static HTML served by nginx (no Node
          runtime), same as mortgagesourcing-web.

          WHAT THE SITE IS (positioning). NextGen Lending is a NEW LENDER running its OWN public,
          EVM-compatible blockchain that behaves like a core-banking platform on-chain. The
          differentiators to lead with:
          - Its own public chain that MIRRORS a core banking platform; bridges to ANY EVM-
            compatible public chain; works with ANY token and stablecoin.
          - An ORACLE that runs real financial contracts — Mortgage Contracts and Savings
            Contracts today, and can support ANY Ethereum smart contract — and triggers real-
            world rails through core events: fiat payments, normal servicing systems, and core
            banking systems.
          - SHIPPROVEN APIs: you write and deploy any DeFi product through them, so a "ShipProven
            Plan" auto-builds and deploys any contract as standard.
          - It is LIVE and verifiable — a block ticker on the site links through to the public
            explorer. Audience is everyone: borrowers/savers, developers, and institutions.

          PAGES (Angular routes, all prerendered):
          1. Home (/) — hero (new lender + its own programmable core-banking chain) + the LIVE
             BLOCK TICKER (signature, see below) + four pillars (own chain / core-banking mirror ·
             bridge + any token/stablecoin · Oracle → real contracts + fiat/servicing/core-banking ·
             ShipProven auto-build) + primary CTAs to the Explorer (live) and ShipProven (see links).
          2. /technology — how it works: chain-as-core-banking, the Oracle → fiat/servicing/core-
             banking event flow, EVM bridge, EVM compatibility. Include ONE signature diagram of the
             Oracle/event flow as INLINE SVG (prerender-safe, themeable, crawlable) with alt/aria text;
             honour prefers-reduced-motion.
          3. /contracts — Mortgage Contracts, Savings Contracts, "any Ethereum smart contract", and
             DeFi products deployable via ShipProven.
          4. /build — the ShipProven developer story: write + deploy DeFi products via the ShipProven
             APIs; Plans auto-build contracts. Link to ShipProven.com (assume it is live).
          Keep a clear header nav + footer across all pages; link out to the Explorer prominently.

          THE SIGNATURE — LIVE BLOCK TICKER (best-effort progressive enhancement, must not break
          crawlability). Prerender a STATIC, crawlable line ("Block #<n> as of <UTC time>") into the
          HTML at build; then client-side JS polls the chain to animate the number ticking up live.
          Take the poll endpoint from the runtime ConfigMap /api.conf.json (same pattern the repo
          already uses for runtime config) — an EVM JSON-RPC eth_blockNumber call (or the explorer's
          block API) — with a sensible default and a graceful fallback: if the endpoint is unset,
          unreachable, or CORS-blocked, keep the static prerendered value and a "View live on the
          Explorer" link rather than erroring. [confirm: blockchain session] the exact RPC/API URL +
          CORS + chain id. Do NOT hard-fail the page on a missing endpoint. The explorer
          (https://explorer.nextgenlending.co.uk/) is the source of truth for chain data — link to it
          rather than rebuilding it; you MAY include a couple of tasteful static screenshots/snippets
          of the explorer as illustrative visuals (label them), but keep on-site chain data light.

          BRAND / VISUAL — propose a clean "institutional fintech × blockchain" identity and express it
          as design tokens (CSS custom properties / Angular theme). Starting direction (refine with
          taste; [confirm: blockchain session] may adjust): a trust-forward DARK ink base for the hero
          and footer — deep midnight navy ~#0B1020 — with light content sections (~#F6F8FC) and white
          cards; ONE electric accent for on-chain/live/CTAs — electric indigo ~#5B6CFF — with a cyan
          ~#22D3EE reserved ONLY for the live-block pulse animation; JetBrains Mono for block numbers /
          hashes / addresses; a modern grotesk for headings (e.g. Space Grotesk) and Inter for body/UI;
          generous whitespace, ~1160px content max-width, subtle rounded cards. One accent only — do
          not introduce colours beyond the token set. Deliberately distinct from the mortgagesourcing
          site (navy + emerald).

          AI-DISCOVERABILITY LAYER (this site is a reference impl of the AI-discoverable stack). Keep
          SSG prerender (outputMode: static) — no JS-only routes, no content behind interaction; all
          content prerenders. Emit JSON-LD (Organization / FinancialService for the lender; describe
          the products/contracts with appropriate schema.org types on /contracts). Emit llms.txt,
          sitemap.xml with <lastmod>, robots.txt with a Sitemap: line, and a visible trust line. Given
          the ShipProven/agent theme, /build MAY advertise a machine endpoint (MCP or the public RPC)
          for AI agents — include it if it is clean to do so, else note it as coming.

          LINKS: Explorer = https://explorer.nextgenlending.co.uk/ (live — link prominently, and the
          block ticker links through to it). ShipProven = https://shipproven.com (assume live — plain
          link). NO regulatory/FCA disclaimers are required for this site — do not add them.

          DATA — read-only. The block number is the only genuinely-live datum (best-effort as above);
          everything else is marketing content + illustrative examples clearly labelled. Do not build
          heavy on-site data tables — the Explorer owns chain data; link to it.

          ACCESSIBILITY: WCAG 2.2 AA. Verify contrast of the electric accent on both the dark hero and
          the light sections. Keep a skip-link, visible focus, keyboard nav, prefers-reduced-motion
          (the ticker animation must respect it).

          DO NOT REGRESS CRAWLABILITY. The golden .lighthouse includes gates that assert this; keep
          prerender/SSG. If a raw-HTML (no-JS) SEO presubmit is not already wired, ADD one that fetches
          RAW HTML with no JS and asserts prerendering, the hero h1 verbatim, the full meta set,
          robots.txt with a Sitemap: line and a well-formed sitemap.xml.

          REPORT IN THE PR DESCRIPTION: the starting state, that you dropped Module Federation and re-
          scaffolded to @angular/build, every brand/design choice you made, exactly which data is live
          (the block ticker) vs illustrative, and every value you left for the blockchain session to
          confirm. Latitude is granted on condition it is recorded.

          ISOLATE TESTING: extend end2end-ui to assert the rebuild landed — brand colours resolve on the
          rendered page, all routes prerender, the home page carries the (static, prerendered) block line
          and the ticker element, JSON-LD is present, llms.txt / sitemap.xml / robots.txt return 200, and
          the Explorer + ShipProven links are present. Runnable against the PR preview; no new infra.

          Done = PR merged (open via open_pr, drive ALL golden gates green — lint, test, npm-audit,
          end2end, end2end-ui, security-scan, ai-review, SEO presubmit included).
