# Bootstrap fx-web — the Angular front end of the fx-ticker Project. Its design
# is sealed as an artifact (Project repo design/fx-web.md, artefact
# 564d6606-baa8-4513-bc74-bceaf7e4d8f3) — the Decision-5 hold is cleared, so the
# FE Plan may graduate.
#
# Bootstrap only here: create from the Angular service template, register both
# clusters, scaffold, drive one green PR. verify-release-flow is auto-injected.
# The ticker UI feature (consume fx-rate-api, render the big live rate per the
# sealed design) is a follow-up dev Plan against this repo.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fx-ticker-web-bootstrap
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-fx-web
        templateRepo: leartech-angular-service-template
        namespace: jx-staging
