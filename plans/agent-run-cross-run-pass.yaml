# The pass that reads many run records at once — the only reader the corpus has.
#
# WHY THIS IS NOT AN EXTRA
# The per-run pass answers "what did this run do". A whole class of question needs several
# runs compared, and a per-run pass structurally cannot answer any of it:
#
#   - Is this the fifth time? An unwritable GOMODCACHE looked like an agent quirk in one
#     run — it invented a cache workaround and carried on. It was only an IMAGE defect once
#     the same workaround turned up in an earlier run. One occurrence is noise.
#   - Did a prompt change work? Wait-tool use went 2:7 to 8:1 after one prompt edit. That is
#     a comparison between runs grouped by prompt sha. A single run's ratio means nothing.
#   - Drift that never fails: turn count creeping up, more bash and fewer MCP calls.
#   - Silence that should be noise: no run in three days called an advertised tool.
#
# If only the per-run pass ever runs, the committed corpus has no reader and PR comments
# alone would have done the whole job. This is what justifies keeping records at all.
#
# THIS PLAN IS LAST IN THE SEQUENCE AND SELF-GATING
# It needs a corpus with records in it, written by the per-run pass. The premise check below
# will STOP if that does not exist yet, rather than inventing a format.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: agent-run-cross-run-pass
spec:
  paused: true
  steps:
    - name: cross-run-pass
      kind: pr
      agentType: leartech-agent-go
      inputs:
        name: cross-run-pass
        repo: mikelear/leartech-agent-run-recorder
        branch: feat/cross-run-pass
        goal: >-
          Add the cross-run pass: a second, less frequent run of this service that reads
          many committed run records together and reports what is true ACROSS runs.

          CONFIRM THE PREMISE FIRST, AND STOP IF IT IS ABSENT. This depends on the per-run
          pass already writing records to mikelear/leartech-agent-run-reports. The corpus is
          CLUSTER-SCOPED: runs/<cluster>/<utc-date>/<run-id>.json, where <cluster> is the
          CLUSTER_ID (gcp|az). Do not assume runs/<utc-date>/ — that was the layout before
          the paths were cluster-scoped, and reading it would find nothing. List runs/ and
          then one level down to see the real shape for yourself, and read the actual JSON
          to learn the real field names. If the corpus is empty or the per-run pass is not
          implemented yet, STOP and say so in the PR description — do NOT invent a record
          format and do not build against a schema you designed yourself. The whole value of
          this pass is that it reads what the other pass actually wrote.

          DECIDE AND STATE WHETHER YOU COMPARE WITHIN A CLUSTER OR ACROSS BOTH. Because the
          corpus is cluster-scoped, "across runs" is ambiguous and the choice changes what a
          finding means: the two clusters run different image streams and different MCP
          server versions, so a metric shift between them can be a cluster difference rather
          than a regression. At the time of writing only runs/gcp/ exists. Pick one, justify
          it in the PR description, and make the report say which runs it covered.

          SAME BINARY, SECOND SUBCOMMAND, SECOND CRONJOB. Do not create a new service. Reuse
          this repo's existing structure — app/, charts/, .lighthouse. For the CronJob-in-its-
          own-chart pattern, leartech-code-audit is the estate's precedent. Follow it for that
          SHAPE ONLY: it carries two presubmits where mcp-servers, plan-api and
          orchestrator-controller all carry ten, so it is the estate's under-gated outlier and
          must not be used as the reference for gates, pipelines or triggers. Modelling this
          repo on it is exactly how recorder-core shipped with three gates instead of eight.
          The schedule is less frequent than the per-run pass; choose it and justify it in the
          PR description.

          GO, INCLUDING THE MODEL CALL. leartech-ai-gateway is OpenAI-compatible
          (GET /v1/models lists models, POST /v1/chat/completions is the call), so the
          narrative is an HTTP POST with JSON. Do not introduce Python. Do not add an agent
          SDK — this is one completion over a computed comparison, not a tool-using agent.

          DETECTION IS DETERMINISTIC; THE MODEL ONLY EXPLAINS. Compute every comparison in
          Go and pass the model the computed result plus the verbatim evidence. At minimum:
          the same tool-error class recurring across records; a metric compared between
          records grouped by prompt sha256; a metric trending across records; and an
          advertised tool with zero calls across consecutive records. If the gateway call
          fails, the deterministic comparison must still be written and the narrative
          recorded as ABSENT — never inferred, never retro-fitted.

          OUTPUT, AND DO NOT CREATE NOISE. Write a period report into the corpus alongside
          the per-run records, and raise a GitHub issue ONLY when a rule fires and only on
          mikelear/leartech-agent-run-reports (which keeps this service's token scoped to
          one repo). It runs repeatedly over an overlapping window, so it MUST NOT open a
          duplicate issue for a finding it has already raised — update the existing open
          issue instead. Say in the PR description how you made that idempotent.

          TREND THE RECORDER'S OWN COVERAGE — THIS IS HOW A FUTURE GAP GETS CAUGHT.
          Every per-run record carries how much of its run was actually readable: total
          lines for the pod, lines the structured query parsed, and lines per source. Treat
          those as first-class metrics and compare them across runs exactly as you compare
          the behavioural ones.

          The reason is that gaps in observability cannot be enumerated in advance. MCP
          servers get added, a field gets renamed, a prompt change makes the agent use a tool
          that logs nothing, an image change drops a log call. Each is invisible in a
          different way and none can be written as a rule beforehand. But all of them move
          the coverage numbers, and a move is detectable without knowing the cause — the same
          reason the wait-tool ratio caught a prompt contradiction nobody predicted.

          ATTRIBUTE THE DROP, DO NOT JUST REPORT IT. Each record carries the prompt sha256,
          the agent image tag and the MCP inventory. When coverage falls, group by those the
          way you group behavioural metrics by prompt sha, and say what changed alongside it.
          "Parse rate fell from 96 percent to 48 percent at image 0.51.0" is actionable;
          "parse rate is 48 percent" is not.

          A SOURCE THAT SHOULD HAVE LOGGED AND DID NOT IS A FINDING. Zero lines from a source
          the run demonstrably exercised — MCP calls happened and mcp-servers logged nothing,
          an AgentRun reached a terminal phase and the controller logged no transition — is
          different from zero lines from a source the run never touched. Distinguish them.
          In the baseline, 43 MCP calls produced 12 mcp-servers lines.

          NO SILENT CAPS. If the pass reads only the last N records, or skips records it
          could not parse, the report must say so explicitly. A report that silently covered
          less than it appears to reads as "nothing found" when it means "did not look".

          A PROMPT CHANGE IS A PROPOSAL. If the comparison suggests the prompt should change,
          say so with the evidence and stop there. Do not edit
          docs/agent-system-prompt.md from this service and do not open a PR against
          leartech-automated-agent automatically.

          ISOLATE TESTING: table-driven Go tests, no network and no cluster. Use the
          gateway's `echo` model only if an integration test is genuinely needed; unit tests
          must not call the gateway at all. Cover each rule firing and not firing, the
          grouping by prompt sha, issue idempotency, and that a gateway failure still yields
          the deterministic report. Non-negative coverage delta.

          Done = PR merged (open via open_pr, drive gates green).
