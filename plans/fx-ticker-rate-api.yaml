# Graduated from the fx-ticker Project (leartech-project-fx-ticker).
# The architecture split (R4-merged) chose fx-rate-api as a Go backend on
# Postgres; the BA research (PR #2, closed Issue #1) and the third-party
# resolution (TrueLayer: recommend mock) fed it. This is the deployable Plan
# the Project emits: stand the Go service up via bootstrap-authed-service, with
# register steps opting in to pr-stuck BA escalation (inherited from the template).
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: fx-ticker-rate-api
spec:
  paused: true
  steps:
    - name: bootstrap
      kind: apply
      use: bootstrap-authed-service
      with:
        name: leartech-fx-ticker-rate-api
        templateRepo: leartech-go-service-template
        language: go
        namespace: jx-staging
