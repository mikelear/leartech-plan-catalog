# Deliver the first ShipProven video hub to the website — the initial release.
#
# Prerequisite (done, design loop): the hub design (Option B, config-driven) is
# sealed as artifact 387e8929-4a91-49e3-9aac-51a36e9a64a2 (label
# ship-proven/video-hub) — SPEC.md + catalog/config schema + the reference
# hub page. For mode=first the artifact delivered IS the kit: the PR scaffolds
# the hub and the single catalog entry's href serves the kit's reference page.
# The first true video-bundle (a self-playing page from the video process)
# arrives later via mode=append. holdingVideo names the catalog entry id
# (v-holding), not an artifact id — it is hub.config.json's key.
#
# kind: apply on the use: step is REQUIRED for plan-api to accept it: the first
# submitted step may not be kind:pr without agentType (which a use: step may
# not carry). apply matches the bootstrap use: pattern; see validator.go first-step invariant.
#
# verify-release-flow is auto-injected after the PR step (R23).
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: website-first-video
spec:
  paused: true
  steps:
    - name: first-video
      use: deploy-video-site
      kind: apply
      with:
        repo: mikelear/leartech-ship-proven-website
        artifactId: 387e8929-4a91-49e3-9aac-51a36e9a64a2
        slug: ship-proven-in-one-minute
        mode: first
        holdingVideo: v-holding
        devAgentType: leartech-agent-ng
