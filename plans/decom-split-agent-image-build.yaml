# Break the two-repo container build CYCLE between leartech-automated-agent and
# leartech-dockerfiles, so the Python decommission can proceed as a deletion rather
# than surgery.
#
# THE CYCLE (verified 2026-08-15 by reading the Dockerfiles + release pipelines)
#   leartech-agent-base                      leartech-dockerfiles
#     └─ leartech-agent-runtime:0.10.182     leartech-automated-agent/Dockerfile.runtime
#          └─ leartech-agent-{go,py,ng,rust} leartech-dockerfiles (FROM $BASE_IMAGE,
#                                              pinned via --build-arg in release.yaml)
#               └─ leartech-automated-agent  Dockerfile:11
#                                              FROM ghcr.io/mikelear/leartech-agent-go:0.31.1
#
# So the FastAPI SERVICE image is built FROM the Go DEV-AGENT image, which is built
# FROM an image the same repo produces. One agent-code change costs TWO cross-repo
# release hops: automated-agent release -> new agent-runtime -> dockerfiles release
# (bump the pin) -> new agent-go -> automated-agent release again -> service image.
#
# It also means the uvicorn service ships a full Go toolchain, golangci-lint,
# govulncheck and yq that it never executes.
#
# THIS DRIFTED FROM THE ORIGINAL DESIGN. Dockerfile.runtime's own header says
# "API server image also FROMs this image (eventually)" — the intent was
# service -> runtime, never service -> agent-go.
#
# WHY THIS IS SEQUENCED FIRST
# When the mechanical API moves to Go, the FastAPI service disappears but
# leartech-agent-runtime MUST survive, because the dev / BA / infra agents stay
# Python (the deliberate Go-control-plane / Python-reasoning seam). While the repo
# builds "service + agent image" as one entangled chain, deleting the service is
# entangled with keeping the image. Decoupling first makes that a deletion.
#
# It is also worth doing on its own merits even if the Go port never happens.
#
# WHAT THIS PLAN DELIBERATELY DOES NOT DO
# It does not remove the remaining one-hop dependency (leartech-dockerfiles builds
# the per-language images FROM leartech-agent-runtime, which automated-agent
# produces). That hop is inherent — the agent CODE lives in one repo and the
# TOOLCHAIN images in the other — and removing it is a much larger question about
# where agent code should live. Scope here is only to take the SERVICE image out of
# the chain, so it stops being both a producer and a consumer of the cycle.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: decom-split-agent-image-build
spec:
  paused: true
  steps:
    - name: service-image-off-agent-go
      kind: pr
      agentType: leartech-agent-py
      inputs:
        name: service-image-off-agent-go
        repo: mikelear/leartech-automated-agent
        branch: chore/service-image-off-agent-go
        goal: >-
          Take the FastAPI service image OUT of the agent image chain so this repo stops
          being both a producer and a consumer of the same container build cycle.

          THE CHANGE. Dockerfile line 11 currently reads
          `FROM ghcr.io/mikelear/leartech-agent-go:0.31.1`. Re-base it on
          leartech-agent-base instead — the same image Dockerfile.runtime already builds
          on. The service image and leartech-agent-runtime then become SIBLINGS off one
          shared base, rather than the service sitting three hops downstream of an image
          this repo itself produces.

          DO NOT re-base onto python:3.14-slim. Verify before you choose the base: the
          service imports `gate.tools.pr_back`, which shells out to the `gh` CLI, and
          `app/` imports ten `gate.*` modules. leartech-agent-base carries
          ca-certificates, curl, git, gh and uv — confirm that list against the actual
          leartech-agent-base Dockerfile in leartech-dockerfiles rather than trusting this
          goal, then confirm every runtime dependency the service actually uses is present.
          If something the service needs is only in leartech-agent-go, install it
          explicitly in this Dockerfile (as ffmpeg already is) rather than keeping the
          agent-go base.

          PIN THE BASE the way the current line does — an explicit tag, and a digest if the
          surrounding convention uses one. Do not float to :latest.

          WHAT MUST NOT REGRESS. The image must still run uvicorn with the same ENTRYPOINT
          and the same absolute-path behaviour the current Dockerfile documents (operators
          run `kubectl exec <pod> -- leartech-agent ...` and depend on the console script
          being resolvable). Keep the COPY --chown ownership so the agent user can still
          write to the lessons catalog at runtime. Keep /workspace uncreated — the chart
          mounts it as an emptyDir and the existing comment explains the kaniko
          --snapshotMode=redo interaction.

          REPORT THE SIZE DELTA in the PR description — before and after. Dropping the Go
          toolchain, golangci-lint, govulncheck and yq from a uvicorn image should be a
          visible reduction, and if it is not, something is still pulling them in and that
          is worth knowing.

          ALSO IN THE PR DESCRIPTION: state explicitly whether the release pipeline still
          builds BOTH images (the service via Dockerfile and leartech-agent-runtime via
          Dockerfile.runtime), and whether they can now build independently rather than in
          sequence. If the pipeline still serialises them unnecessarily, say so — do not
          fix it in this PR, it is a separate change.

          ISOLATE TESTING: this is a build-level change, so prove it at build level. The
          image must build, `uv run pytest` must pass inside it, and the console script
          `leartech-agent --help` must resolve on a default login PATH. Do not weaken any
          existing gate to make the build pass.

          Done = PR merged (open via open_pr, drive gates green).
