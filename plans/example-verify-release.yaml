# Example catalog Plan that consumes the verify-release-flow template.
#
# Demonstrates the intended usage: a Plan `use:`-es verify-release-flow, supplying
# its required params (repo, sha, service). The template's four kind:check steps
# then verify — per cluster — that the release fired+passed, the promote PRs
# opened/green/merged, a boot picked up the commit, and the NEW version is deployed
# healthy; each step opts in to a BA escalation on failure (onFailure.escalate: ba).
#
# `sha` is the release-triggering commit on the service repo's main (an empty commit
# to main is the canonical trigger). The value below is illustrative — a real
# consumer supplies the actual commit.
#
# Hold-by-default (R5): a catalog Plan is a PROPOSAL. It does not execute on merge;
# unpausing is a separate, human-gated action.
apiVersion: agent.leartech.io/v1alpha1
kind: Plan
metadata:
  name: example-verify-release
spec:
  paused: true
  steps:
    # An explicit kind is required on a use: step, and this example previously
    # omitted it. An omitted kind is "" ≡ "pr" (CRD back-compat default), and
    # plan-api rejects a first pr-step with no agentType — which a use: step cannot
    # declare, since the template supplies it. This file never caught it because
    # cmd/plan-submit excludes example-* from submission, so the catalog's only
    # worked example of the use: shape was one that plan-api would refuse. `check`
    # matches what the auto-injection policy sets when it composes this template.
    - name: verify
      kind: check
      use: verify-release-flow
      with:
        repo: mikelear/leartech-plan-api
        sha: "0f490c0cd88fb43c53507771f739b8effe5a291d" # illustrative release-triggering commit
        service: leartech-plan-api
