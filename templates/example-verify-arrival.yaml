# Example catalog PlanTemplate — a reusable building block.
#
# A PlanTemplate is a parameterized sub-plan. Concrete Plans include it with
# `use: <template>` + `with: {param: value}`; expansion is depth-1 and the included
# steps are namespaced `<useStep>-<templateStep>`.
#
# Template rules (plan-lint R9): declare params + steps; every step is CONCRETE
# (kind + agentType) and must NOT nest another `use:`. Step inputs must match the
# agentType (R21) — here the infra agent's action-driven shape.
apiVersion: agent.leartech.io/v1alpha1
kind: PlanTemplate
metadata:
  name: example-verify-arrival
spec:
  params:
    - name: service
      required: true
  steps:
    - name: check-arrival
      kind: check
      agentType: leartech-agent-infra
      inputs:
        action: release-health-check
        service: ${service}
        namespace: jx-staging
        budgetMinutes: 30
