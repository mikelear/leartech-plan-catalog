# bootstrap-authed-service — stand up a NEW authed service (any supported
# language) from a template repo: create -> register(gcp,az) -> scaffold(-> main)
# -> dev(ONE PR). The `language` param (optional, default go) selects the dev
# agent + baked CI Makefile; create/register/scaffold are language-agnostic.
#
# WHY THE FIRST FOUR STEPS RUN ON leartech-agent-infra-go. They are not judgement
# calls. "Create a repo named X", "append X to this cluster's source-config",
# "render this template into that repo" each have one correct outcome and a typed
# result, and infra-go executes them by calling the repofactory functions
# in-process — no model, no MCP hop, no transcription of a verdict into prose.
# The one step that IS a judgement call (adapt the scaffold and drive a PR green)
# runs on a dev agent, which is what a dev agent is for.
#
# HISTORY WORTH KEEPING. These steps were briefly pointed at leartech-agent-go
# while infra-go had only its four read checks, so the actions they name had no
# implementation anywhere: `newRepo`, `scaffold-pr` and `release-health-check`
# were the PYTHON infra agent's vocabulary, which nothing has spoken since it was
# retired. plan-lint accepted them because it required an `action` key without
# checking that the action exists — fixed alongside this template.
#
# NO VERIFY STEP HERE, BY CONSTRUCTION. Nested templates are rejected by
# ExpandPlanSteps, so this template cannot `use: verify-release-flow`. That is a
# feature: verification composes at the PLAN level, where a Plan lists both
# templates and makes the dependency explicit —
#
#   steps:
#     - name: bootstrap
#       use: bootstrap-authed-service
#       with: {name: my-svc, templateRepo: mikelear/leartech-plan-api, namespace: jx-staging}
#     - name: verify
#       use: verify-release-flow
#       with: {repo: mikelear/my-svc}
#       dependsOn: [bootstrap]
#
# — rather than each template growing its own private copy of the release checks.
apiVersion: agent.leartech.io/v1alpha1
kind: PlanTemplate
metadata:
  name: bootstrap-authed-service
spec:
  params:
    - name: name
      required: true # the new service name; becomes the repo name and the auth audience
    - name: templateRepo
      required: true # owner/name to render from (e.g. mikelear/leartech-plan-api, so JWKS/Hydra auth comes baked in)
    - name: namespace
      required: false # deploy namespace for the service; defaults to jx-staging downstream
    - name: language
      required: false # service language (go|angular). OPTIONAL — omitted defaults to
                      # go, so existing Go bootstraps are unchanged. The PLATFORM
                      # derives the dev agentType + baked Makefile from it
                      # (controller buildSubst languageAgent): the Plan expresses
                      # INTENT (a language), the platform owns MECHANISM (which
                      # privileged agent), keeping R22's boundary. New languages
                      # are one map entry in the controller.
  steps:
    # Create the repo under the OWNER account. infra-go refuses this action when
    # GITHUB_OWNER_ADMIN_PAT is absent rather than falling back to the bot token:
    # POST /user/repos creates under the token's own identity, so a bot token
    # would succeed into the bot's account and report a green step.
    - name: create
      kind: apply
      agentType: leartech-agent-infra-go
      inputs:
        action: create-repo
        repo: "mikelear/${name}"
    # Register into each cluster's source-config. Both run from wherever the Plan
    # runs: the cluster param selects which GitOps REPO is edited, and that is a
    # GitHub write, not a cluster write. No `repo` input — the GitOps repo is
    # derived from the cluster, and passing one would be a value nothing reads.
    - name: register-gcp
      kind: pr
      agentType: leartech-agent-infra-go
      repo: mikelear/jx-build-cluster-gsm
      dependsOn: [create]
      inputs:
        action: register-source-config
        cluster: gcp
        service: "${name}"
      onFailure:
        escalate: ba # a source-config PR that opens but won't merge (rebase conflict,
                     # flaked verify, renovate-enrolment) sits at AwaitingReview, not Failed;
                     # the pr-stuck grace escalates it to a BA to shepherd it to merge.
        context:
          repo-kind: gitops
          guidance: >-
            Source-config register PR against a cluster GitOps repo
            (jx-build-cluster-*). If open-but-not-merging: rebase onto the base
            branch if behind, retrigger a flaked verify/qa-gate, and enrol the
            service in Renovate (helmfiles/renovate/configs/renovate.yaml) if
            verify-renovate-enrolment failed. Do NOT self-merge a GitOps PR —
            drive its gates green or escalate to a human.
    - name: register-az
      kind: pr
      agentType: leartech-agent-infra-go
      repo: mikelear/jx-build-cluster-akv
      dependsOn: [create]
      inputs:
        action: register-source-config
        cluster: az
        service: "${name}"
      onFailure:
        escalate: ba # a source-config PR that opens but won't merge (rebase conflict,
                     # flaked verify, renovate-enrolment) sits at AwaitingReview, not Failed;
                     # the pr-stuck grace escalates it to a BA to shepherd it to merge.
        context:
          repo-kind: gitops
          guidance: >-
            Source-config register PR against a cluster GitOps repo
            (jx-build-cluster-*). If open-but-not-merging: rebase onto the base
            branch if behind, retrigger a flaked verify/qa-gate, and enrol the
            service in Renovate (helmfiles/renovate/configs/renovate.yaml) if
            verify-renovate-enrolment failed. Do NOT self-merge a GitOps PR —
            drive its gates green or escalate to a human.
    # Seed main straight from the template (to_main) — NO PR. The first commit
    # MUST land .lighthouse/ onto main, because Lighthouse reads triggers from the
    # BASE branch: a repo whose triggers arrive by PR can never gate that PR. The
    # dev step below then owns the one and only PR.
    # Routing + first-promotion config. Routing is central (Envoy Gateway /
    # cluster-routes), so a new service needs an HTTPRoute entry in addition to
    # source-config; a Go resource server needs a per-cluster auth overlay before
    # its first promote renders. Each is a deterministic, idempotent GitOps PR.
    - name: route-gcp
      kind: apply
      agentType: leartech-agent-infra-go
      repo: mikelear/jx-build-cluster-gsm
      dependsOn: [register-gcp]
      inputs:
        action: register-cluster-route
        cluster: gcp
        service: "${name}"
        language: "${language}"
      onFailure:
        escalate: ba
        context:
          repo-kind: gitops
          hint: "add the missing cluster-routes entry for mikelear/${name} and drive its gates green"
    - name: route-az
      kind: apply
      agentType: leartech-agent-infra-go
      repo: mikelear/jx-build-cluster-akv
      dependsOn: [register-az]
      inputs:
        action: register-cluster-route
        cluster: az
        service: "${name}"
        language: "${language}"
      onFailure:
        escalate: ba
        context:
          repo-kind: gitops
          hint: "add the missing cluster-routes entry for mikelear/${name} and drive its gates green"
    - name: auth-overlay
      kind: apply
      agentType: leartech-agent-infra-go
      repo: mikelear/jx-build-cluster-gsm
      dependsOn: [register-gcp]
      inputs:
        action: register-auth-overlay
        cluster: gcp
        service: "${name}"
        language: "${language}"
    - name: auth-overlay-az
      kind: apply
      agentType: leartech-agent-infra-go
      repo: mikelear/jx-build-cluster-akv
      dependsOn: [register-az]
      inputs:
        action: register-auth-overlay
        cluster: az
        service: "${name}"
        language: "${language}"
    - name: renovate-enrolment
      kind: apply
      agentType: leartech-agent-infra-go
      repo: mikelear/jx-build-cluster-gsm
      dependsOn: [register-gcp]
      inputs:
        action: register-renovate-enrolment
        service: "${name}"
    - name: scaffold
      kind: apply
      agentType: leartech-agent-infra-go
      dependsOn: [register-gcp, register-az]
      inputs:
        action: scaffold
        repo: "mikelear/${name}"
        name: "${name}"
        template: "${templateRepo}"
        to_main: "true"
    # Webhook onboarding — boot's --fast webhook pass does not reliably POST the
    # GitHub Lighthouse hook for a new repo, so create it deterministically and
    # verify it (escalate:ba re-runs create-webhook on a miss). Without it the
    # service repo's PRs may not reach the platform.
    - name: create-webhook
      kind: apply
      agentType: leartech-agent-infra-go
      dependsOn: [scaffold]
      inputs:
        action: create-webhook
        repo: "mikelear/${name}"
    - name: webhook-ready
      kind: check
      agentType: leartech-agent-infra-go
      dependsOn: [create-webhook]
      inputs:
        action: webhook-ready
        repo: "mikelear/${name}"
      onFailure:
        escalate: ba
        context:
          hint: >-
            The repo is missing a Lighthouse webhook. Run the create-webhook infra
            action for mikelear/${name} to POST the gcp + az Lighthouse hooks.
    - name: dev
      kind: pr
      agentType: "${devAgentType}"
      repo: "mikelear/${name}"
      dependsOn: [scaffold]
      inputs:
        name: "${name}-dev"
        repo: "${name}"
        branch: "dev-${name}"
        goal: |
          The ${name} service is already scaffolded onto main (from ${templateRepo}).
          Do the normal, self-contained dev lifecycle: open ONE PR that adapts the scaffold and
          drive it green, then it merges. PUBLISH the PR with the `open_pr` MCP tool — NOT raw
          `gh` — so it is tracked (open_pr records targetPR/headBranch; a raw gh PR is invisible
          to the controller and leaves the step stuck).
          REPRODUCE CI LOCALLY FIRST: this image bakes the CI-equivalent Makefile at
          /usr/local/share/leartech-${mkLang}.mk. Run `make -f /usr/local/share/leartech-${mkLang}.mk ci`
          (lint + test + build + vuln) and fix what it reports BEFORE you push — a failure you can
          see locally in seconds costs a pipeline cycle if you let CI find it.
          BUT CI IS THE AUTHORITY, NOT THE POD. If a local check fails for a reason that is NOT
          reproducible in CI — a toolchain/version skew in THIS pod (e.g. golangci-lint cannot
          decode the stdlib's export-data version), or k8s-injected env (LEARTECH_* from Service
          discovery) leaking into a test — do NOT loop trying to fix the pod's environment. Say so
          once, PUSH, open the PR, and let CI judge. Looping on an unfixable-in-pod local check
          burns the whole budget without ever reaching a PR, which is worse than a PR CI can grade.
          Drive BOTH clusters' gates green; when `wait_for_terminal` reports all_passed, YOUR JOB
          IS DONE — STOP this turn. Do NOT wait for or poll the release/promote (a
          verify-release-flow step owns that; waiting causes a runaway overrun). If you CANNOT
          reach all_passed (blocked, or a gate you can't fix), STOP and say so in your summary —
          do NOT merge. Opening a PR is not success; reaching green is, and a blocked run is
          recorded as a failure so it recycles.
          KEEP the inherited auth middleware (JWKS/Hydra) — the service audience must be ${name}.
          KEEP whatever the template wired (auth already noted; also DB, backing clients, etc.) —
          do NOT rip it out. The service MUST reach /health green: if ANY inherited dependency
          isn't provisioned yet (a DB/CNPG secret, a backing service), make that connection
          lazy/optional so /health is green WITHOUT it — full enablement of such dependencies is
          a follow-up plan.
          No new features — just adapt the scaffold and make it green.
    # Release verification, inlined. The deployable PR this template produces is
    # the `dev` step, INSIDE this template — so plan-api's auto-injection (which
    # only sees top-level submitted steps) does not attach verify-release-flow
    # to it. Without these steps a bootstrapped service's release/promote failures
    # (e.g. a promote PR failing the Renovate-enrolment gate) have no step to
    # escalate from, so they fall to a human. A PlanTemplate MAY hand-author infra
    # steps (R22 bars that only in plain Plans). The ${steps.dev.pr} token is
    # namespaced to the expanded dev step at expansion time by the controller.
    - name: release-passed
      kind: check
      agentType: leartech-agent-infra-go
      dependsOn: [dev]
      inputs:
        action: release-pipeline-status
        repo: "mikelear/${name}"
        pr: "${steps.dev.pr}"
      onFailure:
        escalate: ba
        context:
          hint: "read the release Tekton PipelineRun's failing step; a missing run means the main-push trigger/webhook did not fire"
    - name: promote-merged
      kind: check
      agentType: leartech-agent-infra-go
      dependsOn: [release-passed, route-gcp, route-az, auth-overlay, auth-overlay-az, renovate-enrolment]
      inputs:
        action: promote-status
        repo: "mikelear/${name}"
        service: "${name}"
      onFailure:
        escalate: ba
        context:
          hint: >-
            Inspect the promote PR's qa-gate/verify on the failing cluster's GitOps repo.
            A persistent red gate is a cross-plan hand-off. If verify fails with
            "deployed repo outside Renovate's scope", enrol the service by adding
            "mikelear/${name}" to helmfiles/renovate/configs/renovate.yaml repositories
            (enrolment is preferred over exemption) and open that GitOps PR for a human to merge.
    - name: bootjob-ran
      kind: check
      agentType: leartech-agent-infra-go
      dependsOn: [promote-merged]
      inputs:
        action: bootjob-for-commit
        repo: "mikelear/${name}"
        pr: "${steps.dev.pr}"
      onFailure:
        escalate: ba
        context:
          hint: "check the jx-boot Job logs in jx-git-operator; NO boot at all means the promote merge did not reconcile (deploy-healthy is the authoritative landed signal)"
    - name: deploy-healthy
      kind: check
      agentType: leartech-agent-infra-go
      dependsOn: [promote-merged]
      inputs:
        action: deploy-health
        repo: "mikelear/${name}"
        service: "${name}"
        namespace: jx-staging
      onFailure:
        escalate: ba
        context:
          hint: "compare the running Deployment image tag vs the promoted version per cluster; check pod events + whether the boot applied it"
