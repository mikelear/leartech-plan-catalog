apiVersion: config.lighthouse.jenkins-x.io/v1alpha1
kind: TriggerConfig
spec:
  presubmits:
  # Conventional primary presubmit (context "pr") — the deterministic Go hard
  # gate: rules engine (R1–R19) + CRD-schema conformance (kubeconform). This is
  # the context to mark REQUIRED on main; a red pr must block the merge.
  - name: pr
    context: "pr"
    always_run: true
    source: pullrequest.yaml
  # ADVISORY — the multi-model ai-review via the owned gateway. optional:true so
  # it posts a check + PR comment but never blocks. Its own <cluster>/plan-ai-review
  # context so the advisory verdict is visible independently of the hard gate.
  - name: plan-ai-review
    context: "plan-ai-review"
    always_run: true
    optional: true
    source: plan-ai-review.yaml
