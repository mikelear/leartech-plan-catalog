apiVersion: config.lighthouse.jenkins-x.io/v1alpha1
kind: TriggerConfig
spec:
  presubmits:
  # The deterministic Go hard gate: rules engine (R1–R19) + CRD-schema
  # conformance (kubeconform). Descriptive context name (plan-lint) so a
  # contributor sees exactly what gates their PR. This is the REQUIRED check;
  # a red plan-lint must block the merge. (File stays pullrequest.yaml — the
  # conventional presubmit filename — while the context is renamed.)
  - name: plan-lint
    context: "plan-lint"
    always_run: true
    source: pullrequest.yaml
  # ADVISORY — the multi-model ai-review via the owned gateway. optional:true so
  # it posts a check + PR comment but never blocks. Its own <cluster>/plan-ai-review
  # context so the advisory verdict is visible independently of the hard gate.
  - name: plan-ai-review
    context: "plan-ai-review"
    always_run: true
    optional: true
    source: plan-ai-review.yaml
  # Authoritative CRD check — server-side dry-run against the live cluster (persists
  # nothing). Complements the offline Go rules; catches anything the vendored schema
  # misses. Required-eligible once proven green.
  - name: plan-cluster-verify
    context: "plan-cluster-verify"
    always_run: true
    source: plan-cluster-verify.yaml
  postsubmits:
  # On merge to main: auto-release merged PlanTemplates to the controller's
  # library as a GitOps PR (see scripts/sync-templates-to-controller.sh).
  - name: release
    context: release
    source: release.yaml
    branches:
    - ^main$
