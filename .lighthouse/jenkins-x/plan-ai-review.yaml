apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: plan-ai-review
spec:
  pipelineSpec:
    tasks:
    - name: plan-ai-review
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          # The gateway endpoint is not a secret — set it here (the :8080 port is
          # required). The virtual key comes from the ExternalSecret below.
          # The review panel, from the SAME ConfigMap the PR review and the
          # weekly code audit read. It was hardcoded in
          # scripts/plan-ai-review.sh with REVIEW_MODELS set nowhere, so
          # changing which models review a Plan meant editing a script in this
          # repo. optional:true so an unprovisioned cluster falls back to the
          # script's default rather than failing the step.
          - name: PLAN_REVIEWERS
            valueFrom:
              configMapKeyRef:
                name: ai-review-cluster-config
                key: PLAN_REVIEWERS
                optional: true
          - name: AI_GATEWAY_URL
            value: http://leartech-ai-gateway.ai-gateway.svc.cluster.local:8080
          # Which cluster this run is on (gcp/az) — stamped on the sticky comment
          # and used for a per-cluster comment marker.
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          # Git credentials for the sticky PR comment — tekton-git is a basic-auth
          # secret (keys username/password), matching the pipeline-catalog ai-review task.
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: username
                optional: true
          envFrom:
          # Our OWN AI gateway virtual key for the advisory review — exposes
          # AI_GATEWAY_API_KEY. optional:true so this pipeline still runs (and
          # self-skips) before the key is provisioned.
          - secretRef:
              name: leartech-plan-catalog-ai-key
              optional: true
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        # ADVISORY multi-model review via the OWNED gateway. Never fails the
        # build (exits 0). Posts a sticky PR comment scoring design quality a
        # linter can't judge, and feeds our Plan-quality model flywheel.
        # THE SHARED REVIEW IMAGE, not python:3.12-alpine.
        #
        # This step used to `apk add bash curl git` and `pip install pyyaml` on
        # every run. That is a dependency nothing versions, and it has already
        # failed silently: pyyaml was missing until 2026-08-12, so criterion 7
        # never ran and the only symptom was the reviewer reporting the absent
        # template catalogue as a defect in the Plan under review.
        #
        # ai-review-worker carries git, curl, pyyaml and httpx baked in, is
        # version-pinned, and is the same image the PR review and the weekly
        # code audit run. Three review paths, one toolchain.
        - image: ghcr.io/mikelear/ai-review-worker:0.51.4
          name: plan-ai-review
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          script: |
            #!/bin/bash
            set +e
            # NO RUNTIME INSTALLS. git, curl and pyyaml come from the image.
            # Asserted rather than assumed, because their absence is what made
            # this step degrade silently before: a missing pyyaml turned
            # criterion 7 off and reported the missing catalogue as a Plan
            # defect. A hard failure here is a pipeline someone fixes; a soft
            # one is a review that quietly checks less than it claims.
            missing=""
            for t in git curl python3; do
              command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
            done
            python3 -c "import yaml" 2>/dev/null || missing="$missing pyyaml"
            if [ -n "$missing" ]; then
              echo "plan-ai-review: image is missing:$missing"
              echo "  This step depends on the ai-review-worker image providing them."
              echo "  Refusing to run a review that would silently check less."
              exit 1
            fi
            bash scripts/plan-ai-review.sh || true
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
