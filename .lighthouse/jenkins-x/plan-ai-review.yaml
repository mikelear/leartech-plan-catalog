apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: plan-ai-review
spec:
  pipelineSpec:
    tasks:
    - name: plan-ai-review
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          # The gateway endpoint is not a secret — set it here (the :8080 port is
          # required). The virtual key comes from the ExternalSecret below.
          - name: AI_GATEWAY_URL
            value: http://leartech-ai-gateway.ai-gateway.svc.cluster.local:8080
          # Git credentials for the sticky PR comment — the tekton-git secret is
          # the canonical source (matches the pipeline-catalog ai-review task).
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: GIT_TOKEN
                optional: true
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: GIT_USER
                optional: true
          envFrom:
          # Our OWN AI gateway virtual key for the advisory review — exposes
          # AI_GATEWAY_API_KEY. optional:true so this pipeline still runs (and
          # self-skips) before the key is provisioned.
          - secretRef:
              name: leartech-plan-catalog-ai-key
              optional: true
          name: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: ghcr.io/jenkins-x/jx-boot:3.16.59
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables
        # ADVISORY multi-model review via the OWNED gateway. Never fails the
        # build (exits 0). Posts a sticky PR comment scoring design quality a
        # linter can't judge, and feeds our Plan-quality model flywheel.
        - image: python:3.12-alpine
          name: plan-ai-review
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          script: |
            #!/bin/sh
            set +e
            apk add --no-cache bash curl >/dev/null 2>&1
            . ./.jx/variables.sh 2>/dev/null || true
            export REPO_NAME="${REPO_NAME:-$APP_NAME}"
            bash scripts/plan-ai-review.sh || true
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
