apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: plan-ai-review
spec:
  pipelineSpec:
    tasks:
    - name: plan-ai-review
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          # The gateway endpoint is not a secret — set it here (the :8080 port is
          # required). The virtual key comes from the ExternalSecret below.
          - name: AI_GATEWAY_URL
            value: http://leartech-ai-gateway.ai-gateway.svc.cluster.local:8080
          # Which cluster this run is on (gcp/az) — stamped on the sticky comment
          # and used for a per-cluster comment marker.
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          # Git credentials for the sticky PR comment — tekton-git is a basic-auth
          # secret (keys username/password), matching the pipeline-catalog ai-review task.
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: username
                optional: true
          envFrom:
          # Our OWN AI gateway virtual key for the advisory review — exposes
          # AI_GATEWAY_API_KEY. optional:true so this pipeline still runs (and
          # self-skips) before the key is provisioned.
          - secretRef:
              name: leartech-plan-catalog-ai-key
              optional: true
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        # ADVISORY multi-model review via the OWNED gateway. Never fails the
        # build (exits 0). Posts a sticky PR comment scoring design quality a
        # linter can't judge, and feeds our Plan-quality model flywheel.
        - image: python:3.12-alpine
          name: plan-ai-review
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          script: |
            #!/bin/sh
            set +e
            # git is REQUIRED, not incidental: scripts/plan-ai-review.sh scopes the
            # review to the PR's own diff, and python:3.12-alpine ships no git. Without
            # it the script cannot resolve a base and silently falls back to reviewing
            # every plan in the repo — the exact behaviour the scoping removed.
            apk add --no-cache bash curl git >/dev/null 2>&1
            # pyyaml is REQUIRED, not optional. Without it the script's template-catalog
            # loader falls through to "(template catalog unavailable — pyyaml missing)" and
            # criterion 7 cannot run. That was silently true on EVERY review until
            # 2026-08-12; the only symptom was the reviewer reporting the missing catalog
            # as though it were a defect in the Plan under review.
            # Alpine's py3-yaml apk targets the system python, not this image's
            # /usr/local python, so it must come from pip. A musllinux wheel exists for
            # cp312, so no build toolchain is needed (~2s).
            pip install --quiet --no-input pyyaml >/dev/null 2>&1 \
              || echo "plan-ai-review: WARNING — pip install pyyaml failed; template catalog will be degraded"
            bash scripts/plan-ai-review.sh || true
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
