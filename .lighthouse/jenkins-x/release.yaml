apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: release
spec:
  pipelineSpec:
    tasks:
    - name: release
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          # Which cluster this postsubmit is on — only the primary opens the PR.
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          # tekton-git basic-auth creds to clone the controller repo + open the PR.
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: username
                optional: true
          name: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone.yaml@versionStream
          name: ""
          resources: {}
        # Auto-release: mirror merged PlanTemplates into the controller's library
        # as a GitOps PR (the single install path; re-gated + human-merged there).
        - image: python:3.12-alpine
          name: sync-templates
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          script: |
            #!/bin/sh
            set -u
            apk add --no-cache bash git curl >/dev/null 2>&1
            bash scripts/sync-templates-to-controller.sh
        # Phase-3 catalog GH route: submit THIS MERGE'S plans/*.yaml to plan-api
        # (the SINGLE writer — it validates, applies the auto-composition injection
        # policy, and creates a PAUSED proposal). This is the automation sibling
        # of the plan MCP's create_plan (same POST /plans; s2s token instead of a
        # forwarded user bearer). Runs on BOTH clusters; each self-submits to its
        # LOCAL plan-api, so both estates receive the proposal with no cross-cluster
        # networking.
        #
        # SCOPED TO THE MERGE DIFF (HEAD^..HEAD), unlike the template sync above.
        # The template sync targets a git repo and is a reconciler — re-asserting
        # an unchanged template is a no-op. This targets an apiserver via a
        # one-shot Create that de-duplicates on the LIVE CRD (409 AlreadyExists),
        # so re-asserting the whole directory would RESURRECT any Plan deleted
        # from a cluster on the next unrelated merge. Scoping keeps plans/ a
        # history of what was defined and reviewed, not a mirror of the cluster.
        #
        # The plan-catalog-internal-services client is provisioned on BOTH
        # clusters by leartech-auth-service's setup-internal-clients.sh
        # (INTERNAL_CLIENTS_DEFAULT entry
        # `plan-catalog-internal-services|leartechapi.internal_services|leartech-plan-api`),
        # and the client-secret is synced into the jx namespace by an
        # ExternalSecret. A MISSING secret is therefore a real infra
        # regression, not a normal dormant state: silently submitting no
        # plans at all is the worst possible outcome of this pipeline.
        # The step no longer self-skips on an empty secret env — the CLI's
        # own "LEARTECH_PLAN_SUBMIT_CLIENT_SECRET must be set" error
        # (main.go: fetchToken) fails the release step with a message that
        # names the missing var. optional:true stays on the secretKeyRef
        # itself so a cold-start ExternalSecret race surfaces as the
        # CLI's clear error rather than a pod stuck in
        # CreateContainerConfigError.
        - image: golang:1.24-alpine
          name: submit-plans
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          env:
          # In-cluster literals — identical on both clusters (service DNS), so no
          # per-cluster config is needed. Hydra stamps its public issuer on the
          # minted token regardless of the in-cluster endpoint hit, so plan-api's
          # iss/aud validation still passes. Scope (leartechapi.internal_services)
          # and audience (leartech-plan-api) come from the tool's defaults.
          - name: LEARTECH_PLAN_API_URL
            value: http://leartech-plan-api.jx-staging:8080
          - name: LEARTECH_AUTH_TOKEN_URL
            value: http://leartech-auth-service-hydra-public.jx-staging:4444/oauth2/token
          - name: LEARTECH_PLAN_SUBMIT_CLIENT_ID
            value: plan-catalog-internal-services
          # The client SECRET is the ONLY backend-sourced value — synced from the
          # leartech-secrets store by the plan-catalog-internal-services
          # ExternalSecret (jx namespace). optional:true keeps a cold-start
          # ExternalSecret race from wedging the pod in
          # CreateContainerConfigError; the CLI's own "must be set" error
          # then fails the step with a message that names the missing var.
          - name: LEARTECH_PLAN_SUBMIT_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: plan-catalog-internal-services
                key: client-secret
                optional: true
          script: |
            #!/bin/sh
            set -eu
            apk add --no-cache git >/dev/null 2>&1
            go run ./cmd/plan-submit -dir plans
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
